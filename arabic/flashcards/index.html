<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — البطاقات التعليمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:      #1b2a5e;
    --primary-dark: #111c42;
    --gold:       #c9a13b;
    --gold-soft:  #e3cf8f;
    --vellum:     #f7f2e7;
    --vellum-dim: #ece4d2;
    --ink:        #22243a;
    --green:      #1b4d38;
    --red:        #7a2e2e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--vellum); color: var(--ink); font-family: 'Spectral', Georgia, serif; min-height: 100vh; }
  header { background: var(--primary); color: var(--vellum); padding: 2rem 1.5rem 2.4rem; text-align: center; border-bottom: 5px solid var(--gold); }
  .header-logo { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--gold); display: block; margin: 0 auto .6rem; }
  header .eyebrow { font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: .4rem; }
  header h1 { font-weight: 500; font-size: clamp(1.3rem, 4vw, 1.9rem); }
  header .arabic-title { font-family: 'Amiri', serif; font-size: 1.5rem; color: var(--gold-soft); margin-top: .3rem; }
  .site-nav { margin-top: .8rem; display: flex; gap: 1.4rem; justify-content: center; flex-wrap: wrap; }
  .site-nav a { color: var(--gold-soft); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid rgba(201,161,59,.5); padding-bottom: 2px; }
  .site-nav a:hover { color: #fff; border-color: #fff; }

  .controls { max-width: 720px; margin: -1.2rem auto 0; background: var(--primary-dark); border: 1px solid rgba(201,161,59,.45); border-radius: 14px; padding: .9rem 1.2rem; display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; justify-content: center; position: relative; z-index: 2; box-shadow: 0 10px 30px rgba(17,28,66,.25); }
  .controls select, .controls button { font-family: inherit; font-size: .88rem; padding: .5rem .9rem; border-radius: 999px; border: 1px solid var(--gold); background: var(--vellum); color: var(--ink); cursor: pointer; }
  .controls button.gold { background: var(--gold); color: var(--primary-dark); font-weight: 600; }
  .controls label { color: var(--gold-soft); font-size: .8rem; display: flex; align-items: center; gap: .35rem; }

  main { max-width: 720px; margin: 1.6rem auto 2.6rem; padding: 0 1rem; }
  .progress { display: flex; justify-content: center; gap: 1.4rem; font-size: .85rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .progress b { font-weight: 600; }
  .progress .k { color: var(--green); } .progress .a { color: var(--red); }

  .stage { perspective: 1200px; }
  .card { position: relative; width: 100%; max-width: 480px; height: 280px; margin: 0 auto; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; }
  .card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .7rem; padding: 1.4rem; text-align: center; box-shadow: 0 12px 34px rgba(17,28,66,.18); }
  .face.front { background: #fff; border: 1px solid var(--vellum-dim); border-top: 6px solid var(--primary); }
  .face.back  { background: var(--primary); color: var(--vellum); border-top: 6px solid var(--gold); transform: rotateY(180deg); }
  .face .ar { font-family: 'Amiri', serif; font-size: 3rem; direction: rtl; line-height: 1.3; }
  .face.back .ar { color: var(--gold-soft); }
  .face .tr { font-style: italic; color: #8a6d2f; }
  .face.back .tr { color: var(--gold-soft); }
  .face .en { font-size: 1.5rem; }
  .face .hint { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: #9a9cb3; margin-top: .5rem; }
  .face.back .hint { color: rgba(247,242,231,.55); }

  .actions { display: flex; justify-content: center; gap: .8rem; margin-top: 1.3rem; flex-wrap: wrap; }
  .actions button { font-family: inherit; font-size: .95rem; padding: .65rem 1.5rem; border-radius: 999px; border: 0; cursor: pointer; color: #fff; }
  .actions .again { background: var(--red); }
  .actions .know  { background: var(--green); }
  .actions .flip  { background: var(--primary); }
  .done { text-align: center; padding: 2.5rem 1rem; }
  .done h2 { font-weight: 500; margin-bottom: .6rem; }
  .done p { color: #6b6d85; margin-bottom: 1.2rem; }
  .hiddenEl { display: none !important; }
</style>
</head>
<body>
<header>
  <img class="header-logo" src="../../assets/logo.jpeg" alt="Al Baseera Academy">
  <div class="eyebrow">Al Baseera Academy · Arabic</div>
  <h1>Flashcards</h1>
  <div class="arabic-title">البطاقات التعليمية</div>
  <nav class="site-nav">
    <a href="../../">Home</a>
    <a href="../vocab/">Vocabulary</a>
    <a href="../dictionary/">Dictionary</a>
  </nav>
</header>

<div class="controls">
  <select id="deckSel"></select>
  <label><input type="checkbox" id="frontAr" checked> Arabic side first</label>
  <button id="shuffleBtn">🔀 Shuffle</button>
  <button id="resetBtn" class="gold">↺ Restart deck</button>
</div>

<main>
  <div class="progress">
    <span>Card <b id="pos">–</b> / <b id="total">–</b></span>
    <span class="k">✓ Know: <b id="known">0</b></span>
    <span class="a">↻ Again: <b id="again">0</b></span>
  </div>

  <div class="stage" id="stage">
    <div class="card" id="card">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
    <div class="actions">
      <button class="again" id="btnAgain">↻ Again</button>
      <button class="flip" id="btnFlip">Flip</button>
      <button class="know" id="btnKnow">✓ Know it</button>
    </div>
  </div>

  <div class="done hiddenEl" id="done">
    <h2>Deck complete 🎉</h2>
    <p id="doneStats"></p>
    <div class="actions">
      <button class="again" id="btnRedoAgain">Review the "Again" pile</button>
      <button class="flip" id="btnRedoAll">Restart full deck</button>
    </div>
  </div>
</main>

<script>
let DECKS = {}, deckKey = '', queue = [], idx = 0, known = 0, againPile = [], flipped = false;
const LS = k => 'albaseera-fc-' + k;

Promise.all([
  fetch('../vocab/levels.json').then(r => r.json()),
  fetch('../../islamic-studies/vocab/months.json').then(r => r.json())
]).then(([lv, mo]) => {
  for (const lvl of ['level1', 'level2']) {
    const L = 'Arabic L' + lvl.slice(-1);
    const all = [];
    for (const m of Object.keys(lvl === 'level1' ? lv.level1 : lv.level2).sort((a,b)=>a-b)) {
      const t = lv[lvl][m];
      DECKS[`${L} · M${m}: ${t.topic}`] = t.words;
      all.push(...t.words);
    }
    DECKS[`${L} · All months`] = all;
  }
  const isAll = [];
  for (const m of Object.keys(mo).sort((a,b)=>a-b)) {
    DECKS[`Islamic Studies · ${mo[m].name}`] = mo[m].words;
    isAll.push(...mo[m].words);
  }
  DECKS['Islamic Studies · All months'] = isAll;
  DECKS['Everything'] = [...new Map(Object.values(DECKS).flat().map(w => [w[0]+w[2], w])).values()];

  const sel = document.getElementById('deckSel');
  sel.innerHTML = Object.keys(DECKS).map(k => `<option>${k}</option>`).join('');
  sel.onchange = () => loadDeck(sel.value);
  loadDeck(localStorage.getItem(LS('deck')) && DECKS[localStorage.getItem(LS('deck'))] ? localStorage.getItem(LS('deck')) : Object.keys(DECKS)[0]);
  if (DECKS[sel.value]) sel.value = deckKey;
});

function loadDeck(k, cards) {
  deckKey = k;
  localStorage.setItem(LS('deck'), k);
  document.getElementById('deckSel').value = k;
  queue = (cards || DECKS[k]).slice();
  idx = 0; known = 0; againPile = [];
  show();
}

function shuffle() {
  const rest = queue.slice(idx);
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  queue = queue.slice(0, idx).concat(rest);
  show();
}

function show() {
  flipped = false;
  document.getElementById('card').classList.remove('flipped');
  const doneEl = document.getElementById('done'), stage = document.getElementById('stage');
  if (idx >= queue.length) {
    stage.classList.add('hiddenEl'); doneEl.classList.remove('hiddenEl');
    document.getElementById('doneStats').textContent =
      `${known} known · ${againPile.length} to review`;
    document.getElementById('btnRedoAgain').style.display = againPile.length ? '' : 'none';
    updateBar(); return;
  }
  stage.classList.remove('hiddenEl'); doneEl.classList.add('hiddenEl');
  const [ar, tr, en] = queue[idx];
  const arFirst = document.getElementById('frontAr').checked;
  const arSide = `<div class="ar">${ar}</div><div class="tr">${tr}</div><div class="hint">tap to flip</div>`;
  const enSide = `<div class="en">${en}</div><div class="hint">tap to flip</div>`;
  document.getElementById('front').innerHTML = arFirst ? arSide : enSide;
  document.getElementById('back').innerHTML  = arFirst
    ? `<div class="en">${en}</div><div class="ar" style="font-size:1.6rem">${ar}</div><div class="hint">tap to flip back</div>`
    : `<div class="ar">${ar}</div><div class="tr">${tr}</div><div class="hint">tap to flip back</div>`;
  updateBar();
}

function updateBar() {
  document.getElementById('pos').textContent = Math.min(idx + 1, queue.length);
  document.getElementById('total').textContent = queue.length;
  document.getElementById('known').textContent = known;
  document.getElementById('again').textContent = againPile.length;
}

document.getElementById('card').onclick = () => {
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
};
document.getElementById('btnFlip').onclick = () => document.getElementById('card').click();
document.getElementById('btnKnow').onclick = () => { known++; idx++; show(); };
document.getElementById('btnAgain').onclick = () => { againPile.push(queue[idx]); idx++; show(); };
document.getElementById('shuffleBtn').onclick = shuffle;
document.getElementById('resetBtn').onclick = () => loadDeck(deckKey);
document.getElementById('frontAr').onchange = show;
document.getElementById('btnRedoAgain').onclick = () => loadDeck(deckKey, againPile);
document.getElementById('btnRedoAll').onclick = () => loadDeck(deckKey);
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); document.getElementById('card').click(); }
  if (e.key === 'ArrowRight') document.getElementById('btnKnow').click();
  if (e.key === 'ArrowLeft') document.getElementById('btnAgain').click();
});
</script>
</body>
</html>
