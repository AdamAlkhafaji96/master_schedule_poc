<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arabic Numbers — Interactive Sounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --lapis:      #1b4d38;
    --lapis-dark: #0f3324;
    --gold:       #c9a13b;
    --gold-soft:  #e3cf8f;
    --vellum:     #f7f2e7;
    --vellum-dim: #ece4d2;
    --ink:        #22243a;
    --playing:    #2e7d5b;
    --missing:    #a34a3c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--vellum);
    color: var(--ink);
    font-family: 'Spectral', Georgia, serif;
    min-height: 100vh;
  }
  header {
    background: var(--lapis);
    color: var(--vellum);
    padding: 2.2rem 1.5rem 2.6rem;
    text-align: center;
    border-bottom: 5px solid var(--gold);
  }
  .header-logo {
    width: 54px; height: 54px; border-radius: 50%;
    border: 2px solid var(--gold);
    display: block; margin: 0 auto .6rem;
  }
  header .eyebrow {
    font-size: .78rem;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin-bottom: .4rem;
  }
  header h1 {
    font-weight: 500;
    font-size: clamp(1.4rem, 4vw, 2rem);
    letter-spacing: .02em;
  }
  .site-nav { margin-top: .9rem; }
  .site-nav a {
    color: var(--gold-soft);
    font-size: .82rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    text-decoration: none;
    border-bottom: 1px solid rgba(201,161,59,.5);
    padding-bottom: 2px;
  }
  .site-nav a:hover { color: #fff; border-color: #fff; }

  .hero-letter {
    max-width: 720px;
    margin: -1.4rem auto 0;
    background: var(--lapis-dark);
    border: 1px solid rgba(201,161,59,.45);
    border-radius: 14px;
    color: var(--vellum);
    padding: 1.6rem 1.4rem 1.4rem;
    text-align: center;
    box-shadow: 0 10px 30px rgba(15,51,36,.25);
    position: relative;
    z-index: 2;
  }
  .hero-letter .big-glyph {
    font-family: 'Amiri', serif;
    font-size: clamp(4.5rem, 14vw, 7rem);
    line-height: 1.15;
    color: var(--gold-soft);
  }
  .hero-index {
    display: block;
    font-size: .72rem;
    letter-spacing: .24em;
    color: rgba(247,242,231,.5);
    margin-bottom: .2rem;
  }
  .letter-name { font-size: 1.15rem; letter-spacing: .06em; margin-top: .2rem; }
  .letter-name em { color: var(--gold-soft); font-style: normal; }
  .hero-translit {
    display: block;
    font-size: .92rem;
    color: rgba(247,242,231,.8);
    margin-top: .25rem;
    letter-spacing: .03em;
  }
  .replay {
    margin-top: 1.2rem;
    background: transparent;
    color: var(--gold-soft);
    border: 1px solid var(--gold);
    border-radius: 999px;
    padding: .5rem 1.4rem;
    font-family: inherit;
    font-size: .85rem;
    letter-spacing: .1em;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .replay:hover, .replay:focus-visible { background: var(--gold); color: var(--lapis-dark); }
  .replay:focus-visible { outline: 2px solid var(--vellum); outline-offset: 2px; }

  main {
    max-width: 720px;
    margin: 2.2rem auto 3.5rem;
    padding: 0 1.2rem;
  }
  .grid-note {
    text-align: center;
    font-size: .85rem;
    color: #6b6a60;
    margin-bottom: 1.4rem;
    letter-spacing: .04em;
  }
  .numbers {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* 4 across, like the alphabet */
    gap: .7rem;
  }
  .number-card {
    background: #fff;
    border: 1px solid var(--vellum-dim);
    border-radius: 10px;
    padding: .7rem .4rem .55rem;
    text-align: center;
    cursor: pointer;
    transition: border-color .12s, box-shadow .12s;
    box-shadow: 0 1px 3px rgba(34,36,58,.06);
  }
  .number-card:hover {
    border-color: var(--gold);
    box-shadow: 0 4px 12px rgba(34,36,58,.1);
  }
  .number-card .glyph {
    font-family: 'Amiri', serif;
    font-size: 2.3rem;
    line-height: 1.2;
    color: var(--lapis);
  }
  .number-card .western {
    display: block;
    font-size: .95rem;
    color: var(--gold);
    font-weight: 600;
  }
  .number-card .name {
    display: block;
    font-size: .78rem;
    margin-top: .1rem;
    color: #55544a;
    letter-spacing: .03em;
  }
  .card-audio { display: flex; justify-content: center; margin-top: .5rem; }
  .audio-btn {
    width: 100%;
    max-width: 90px;
    font-family: inherit;
    font-size: .68rem;
    letter-spacing: .05em;
    padding: .32rem .2rem;
    border-radius: 6px;
    border: 1px solid var(--lapis);
    background: transparent;
    color: var(--lapis);
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .audio-btn:hover { background: var(--lapis); color: #fff; }
  .audio-btn:focus-visible { outline: 3px solid var(--lapis); outline-offset: 2px; }
  .audio-btn.playing { background: var(--playing); border-color: var(--playing); color: #fff; }
  .audio-btn.missing { background: var(--missing); border-color: var(--missing); color: #fff; }
  .number-card.playing { border-color: var(--playing); }
  .number-card.playing .glyph { color: var(--playing); }

  .pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 1.2rem;
  }
  .pager-btn {
    background: transparent;
    border: 1px solid var(--lapis);
    color: var(--lapis);
    border-radius: 999px;
    width: 42px;
    height: 42px;
    font-size: 1.15rem;
    font-family: inherit;
    cursor: pointer;
    transition: background .12s, color .12s, opacity .12s;
  }
  .pager-btn:hover:not(:disabled) { background: var(--lapis); color: #fff; }
  .pager-btn:focus-visible { outline: 3px solid var(--lapis); outline-offset: 2px; }
  .pager-btn:disabled { opacity: .3; cursor: default; }
  .pager-label {
    min-width: 88px;
    text-align: center;
    font-size: .95rem;
    letter-spacing: .08em;
    color: var(--lapis);
    font-weight: 600;
  }

  .status {
    text-align: center;
    min-height: 1.4rem;
    margin-top: 1.2rem;
    font-size: .85rem;
    color: var(--missing);
  }
  footer {
    text-align: center;
    font-size: .78rem;
    color: #8a887c;
    padding: 0 1rem 2.5rem;
  }
  @media (prefers-reduced-motion: reduce) {
    .number-card, .audio-btn, .replay { transition: none; }
  }
</style>
</head>
<body>

<header>
  <img class="header-logo" src="../../assets/logo.jpeg" alt="Al Baseera Academy">
  <div class="eyebrow">Learn to count</div>
  <h1>Arabic Numbers</h1>
  <div class="site-nav"><a href="../letters/">&larr; Alphabet</a> <a href="../../quran/text/" style="margin-left:1rem">Quran</a> <a href="../../" style="margin-left:1rem">Home</a></div>
</header>

<section class="hero-letter" aria-live="polite">
  <div class="big-glyph" id="heroGlyph">٠</div>
  <div class="letter-name" id="heroName"><em>Ṣifr</em> — tap any number below to hear it</div>
  <button class="replay" id="replayBtn">Play sound again</button>
</section>

<main>
  <p class="grid-note">Arabic-Indic numerals with their Western equivalents.</p>
  <div class="pager">
    <button class="pager-btn" id="prevPage" aria-label="Previous ten numbers">&larr;</button>
    <span class="pager-label" id="pageLabel">0 – 9</span>
    <button class="pager-btn" id="nextPage" aria-label="Next ten numbers">&rarr;</button>
  </div>
  <div class="numbers" id="numberGrid"></div>
  <p class="status" id="status"></p>
</main>

<footer>
  Sounds load from the <code>sounds/</code> folder as <code>num_&lt;value&gt;.mp3</code>. Placeholder tones included — replace with your recordings of the same names.
</footer>

<script>
/* ==============================================================
   1. NUMBER DATA — 0 through 100, generated
   glyph: Arabic-Indic numeral; name: transliterated Arabic name
   Compounds (21–99) follow the units-then-tens pattern:
   e.g. 21 = Wāḥid wa-‘ishrūn ("one and twenty").
   ============================================================== */
const UNITS = ['Ṣifr','Wāḥid','Ithnān','Thalātha','Arba‘a','Khamsa',
               'Sitta','Sab‘a','Thamāniya','Tis‘a'];
const TEENS = ['‘Ashara','Aḥada ‘ashar','Ithnā ‘ashar','Thalāthata ‘ashar',
               'Arba‘ata ‘ashar','Khamsata ‘ashar','Sittata ‘ashar',
               'Sab‘ata ‘ashar','Thamāniyata ‘ashar','Tis‘ata ‘ashar'];
const TENS  = {20:'‘Ishrūn',30:'Thalāthūn',40:'Arba‘ūn',50:'Khamsūn',
               60:'Sittūn',70:'Sab‘ūn',80:'Thamānūn',90:'Tis‘ūn'};
const ARABIC_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];

function toArabicGlyph(v) {
  return String(v).split('').map(d => ARABIC_DIGITS[+d]).join('');
}
function numberName(v) {
  if (v < 10)  return UNITS[v];
  if (v < 20)  return TEENS[v - 10];
  if (v === 100) return 'Mi’a';
  const tens = Math.floor(v / 10) * 10, unit = v % 10;
  if (unit === 0) return TENS[tens];
  // units first, joined with "wa-" (and), tens lowercased
  return UNITS[unit] + ' wa-' + TENS[tens].toLowerCase();
}

const NUMBERS = [];
for (let v = 0; v <= 100; v++) {
  NUMBERS.push({ value: v, glyph: toArabicGlyph(v), name: numberName(v) });
}

/* ==============================================================
   1b. PAGINATION — 10 numbers per page
   Pages: 0–9, 10–19, ..., 90–100 (last page holds eleven).
   ============================================================== */
const PAGE_SIZE = 10;
const PAGES = [];
for (let start = 0; start < 100; start += PAGE_SIZE) {
  const end = (start === 90) ? 100 : start + PAGE_SIZE - 1;
  PAGES.push(NUMBERS.filter(n => n.value >= start && n.value <= end));
}
let currentPage = 0;

/* ==============================================================
   2. AUDIO MAPPING — same pattern as the alphabet page
   Each number: sounds/num_<value>.mp3  (e.g. sounds/num_3.mp3)
   ============================================================== */
const AUDIO_BASE = '../sounds/';
const AUDIO_EXT  = '.mp3';

const AUDIO_MAP = {};
NUMBERS.forEach(n => { AUDIO_MAP[n.value] = 'num_' + n.value + AUDIO_EXT; });
// Example override:
// AUDIO_MAP[3] = 'custom/thalatha_teacher.mp3';

const audioCache = {};
let nowPlaying = null;

function playNumber(value, btn) {
  const statusEl = document.getElementById('status');
  statusEl.textContent = '';
  if (nowPlaying) { nowPlaying.pause(); nowPlaying.currentTime = 0; }

  if (!audioCache[value]) {
    audioCache[value] = new Audio(AUDIO_BASE + AUDIO_MAP[value]);
  }
  const audio = audioCache[value];
  audio.currentTime = 0;
  nowPlaying = audio;

  const card = btn && btn.closest('.number-card');
  btn && btn.classList.add('playing');
  card && card.classList.add('playing');
  const clear = () => {
    btn && btn.classList.remove('playing');
    card && card.classList.remove('playing');
  };
  audio.onended = clear;
  audio.onpause = clear;

  audio.play().catch(() => {
    clear();
    btn && btn.classList.add('missing');
    setTimeout(() => btn && btn.classList.remove('missing'), 600);
    statusEl.textContent =
      'No recording for ' + value + ' — add sounds/' + AUDIO_MAP[value];
    playPlaceholderTone();
  });
}

let audioCtx;
function playPlaceholderTone() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = 440;
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.35);
}

/* ==============================================================
   3. BUILD THE GRID + HERO WIRING
   ============================================================== */
let currentValue = 0;

function showInHero(num) {
  document.getElementById('heroGlyph').textContent = num.glyph;
  document.getElementById('heroName').innerHTML =
    '<span class="hero-index">' + (NUMBERS.indexOf(num) + 1) + ' / ' + NUMBERS.length + '</span>' +
    '<em>' + num.name + '</em>' +
    '<span class="hero-translit">the number ' + num.value + '</span>';
}

const grid = document.getElementById('numberGrid');

function buildCard(num) {
  const card = document.createElement('div');
  card.className = 'number-card';
  card.dataset.value = num.value;
  card.innerHTML =
    '<span class="glyph">' + num.glyph + '</span>' +
    '<span class="western">' + num.value + '</span>' +
    '<span class="name">' + num.name + '</span>' +
    '<div class="card-audio">' +
      '<button class="audio-btn" aria-label="Play the number ' + num.name + '">Sound</button>' +
    '</div>';
  const btn = card.querySelector('.audio-btn');
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    currentValue = num.value;
    showInHero(num);
    playNumber(num.value, btn);
  });
  card.addEventListener('click', () => {
    currentValue = num.value;
    showInHero(num);
    playNumber(num.value, btn);
  });
  return card;
}

function renderPage(pageIdx) {
  currentPage = Math.max(0, Math.min(PAGES.length - 1, pageIdx));
  grid.innerHTML = '';
  PAGES[currentPage].forEach(num => grid.appendChild(buildCard(num)));

  const page = PAGES[currentPage];
  document.getElementById('pageLabel').textContent =
    page[0].value + ' – ' + page[page.length - 1].value;
  document.getElementById('prevPage').disabled = currentPage === 0;
  document.getElementById('nextPage').disabled = currentPage === PAGES.length - 1;
}

document.getElementById('prevPage').addEventListener('click', () => renderPage(currentPage - 1));
document.getElementById('nextPage').addEventListener('click', () => renderPage(currentPage + 1));

/* Keyboard: left/right arrows page too */
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft')  renderPage(currentPage - 1);
  if (e.key === 'ArrowRight') renderPage(currentPage + 1);
});

renderPage(0);

document.getElementById('replayBtn').addEventListener('click', () => {
  const btn = document.querySelector(
    '[data-value="' + currentValue + '"] .audio-btn');
  playNumber(currentValue, btn);
});
</script>
</body>
</html>
