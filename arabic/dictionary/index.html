<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dictionary — القاموس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:      #1b2a5e;
    --primary-dark: #111c42;
    --gold:       #c9a13b;
    --gold-soft:  #e3cf8f;
    --vellum:     #f7f2e7;
    --vellum-dim: #ece4d2;
    --ink:        #22243a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--vellum); color: var(--ink); font-family: 'Spectral', Georgia, serif; min-height: 100vh; }
  header { background: var(--primary); color: var(--vellum); padding: 2rem 1.5rem 2.4rem; text-align: center; border-bottom: 5px solid var(--gold); }
  .header-logo { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--gold); display: block; margin: 0 auto .6rem; }
  header .eyebrow { font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: .4rem; }
  header h1 { font-weight: 500; font-size: clamp(1.3rem, 4vw, 1.9rem); }
  header .arabic-title { font-family: 'Amiri', serif; font-size: 1.5rem; color: var(--gold-soft); margin-top: .3rem; }
  .site-nav { margin-top: .8rem; display: flex; gap: 1.4rem; justify-content: center; flex-wrap: wrap; }
  .site-nav a { color: var(--gold-soft); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid rgba(201,161,59,.5); padding-bottom: 2px; }
  .site-nav a:hover { color: #fff; border-color: #fff; }

  .controls { max-width: 780px; margin: -1.2rem auto 0; background: var(--primary-dark); border: 1px solid rgba(201,161,59,.45); border-radius: 14px; padding: .9rem 1.2rem; display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; justify-content: center; position: relative; z-index: 2; box-shadow: 0 10px 30px rgba(17,28,66,.25); }
  .controls input[type=search] { flex: 1; min-width: 220px; font-family: inherit; font-size: .95rem; padding: .55rem .9rem; border-radius: 999px; border: 1px solid var(--gold); background: var(--vellum); color: var(--ink); }
  .dir-toggle { display: flex; border: 1px solid var(--gold); border-radius: 999px; overflow: hidden; }
  .dir-toggle button { font-family: inherit; font-size: .8rem; letter-spacing: .06em; padding: .5rem 1rem; border: 0; background: transparent; color: var(--gold-soft); cursor: pointer; }
  .dir-toggle button.on { background: var(--gold); color: var(--primary-dark); font-weight: 600; }

  .filters { max-width: 780px; margin: .9rem auto 0; padding: 0 1rem; display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; }
  .filters button { font-family: inherit; font-size: .74rem; padding: .3rem .8rem; border-radius: 999px; border: 1px solid var(--primary); background: #fff; color: var(--primary); cursor: pointer; }
  .filters button.on { background: var(--primary); color: var(--vellum); }

  main { max-width: 780px; margin: 1.4rem auto 2.6rem; padding: 0 1rem; }
  .count { text-align: center; font-size: .82rem; color: #6b6d85; margin-bottom: .8rem; }
  .entry { background: #fff; border: 1px solid var(--vellum-dim); border-left: 4px solid var(--primary); border-radius: 10px; padding: .8rem 1.1rem; margin-bottom: .6rem; display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  .entry .ar { font-family: 'Amiri', serif; font-size: 1.7rem; color: var(--primary); direction: rtl; }
  .entry .tr { font-size: .85rem; font-style: italic; color: #8a6d2f; }
  .entry .en { font-size: 1rem; flex: 1; min-width: 40%; }
  body[data-dir="ar"] .entry { flex-direction: row-reverse; text-align: right; }
  .entry .tags { width: 100%; display: flex; gap: .35rem; flex-wrap: wrap; }
  .entry .tag { font-size: .66rem; letter-spacing: .05em; background: var(--vellum); border: 1px solid var(--vellum-dim); border-radius: 999px; padding: .12rem .55rem; color: #6b6d85; }
  .empty { text-align: center; color: #6b6d85; padding: 2rem 0; }
</style>
</head>
<body data-dir="en">
<header>
  <img class="header-logo" src="../../assets/logo.jpeg" alt="Al Baseera Academy">
  <div class="eyebrow">Al Baseera Academy · Arabic</div>
  <h1>Dictionary</h1>
  <div class="arabic-title">القاموس</div>
  <nav class="site-nav">
    <a href="../../">Home</a>
    <a href="../vocab/">Vocabulary</a>
    <a href="../flashcards/">Flashcards</a>
  </nav>
</header>

<div class="controls">
  <div class="dir-toggle" id="dirToggle">
    <button data-d="en" class="on">English → Arabic</button>
    <button data-d="ar">Arabic → English</button>
  </div>
  <input type="search" id="q" placeholder="Search English, Arabic, or transliteration…">
</div>
<div class="filters" id="filters"></div>

<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>

<script>
let DATA = [], dir = 'en', srcFilter = 'All';

const strip = s => s.normalize('NFD').replace(/[\u064B-\u065F\u0670\u0640]/g, '');

fetch('dictionary.json').then(r => r.json()).then(d => {
  DATA = d.entries;
  buildFilters();
  render();
});

function srcGroup(s) { return s.split(' · ')[0]; }

function buildFilters() {
  const groups = ['All', ...new Set(DATA.flatMap(e => e.src.map(srcGroup)))];
  const el = document.getElementById('filters');
  el.innerHTML = groups.map(g => `<button data-g="${g}" class="${g === 'All' ? 'on' : ''}">${g}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => {
    srcFilter = b.dataset.g;
    el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
}

document.getElementById('q').addEventListener('input', render);
document.querySelectorAll('#dirToggle button').forEach(b => b.onclick = () => {
  dir = b.dataset.d;
  document.body.dataset.dir = dir;
  document.querySelectorAll('#dirToggle button').forEach(x => x.classList.toggle('on', x === b));
  render();
});

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let rows = DATA.filter(e =>
    (srcFilter === 'All' || e.src.some(s => srcGroup(s) === srcFilter)) &&
    (!q || e.en.toLowerCase().includes(q) || e.tr.toLowerCase().includes(q) ||
     e.ar.includes(q) || e.bare.includes(strip(q)))
  );
  rows.sort(dir === 'en'
    ? (a, b) => a.en.toLowerCase().localeCompare(b.en.toLowerCase())
    : (a, b) => a.bare.localeCompare(b.bare, 'ar'));
  document.getElementById('count').textContent = rows.length + ' of ' + DATA.length + ' entries';
  document.getElementById('list').innerHTML = rows.length ? rows.map(e => `
    <div class="entry">
      ${dir === 'en'
        ? `<span class="en">${e.en}</span><span class="ar">${e.ar}</span><span class="tr">${e.tr}</span>`
        : `<span class="ar">${e.ar}</span><span class="tr">${e.tr}</span><span class="en">${e.en}</span>`}
      <span class="tags">${e.src.map(s => `<span class="tag">${s}</span>`).join('')}</span>
    </div>`).join('') : '<div class="empty">No entries match your search.</div>';
}
</script>
</body>
</html>
