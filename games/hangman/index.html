<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Hangman — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:      #8a6d22;
    --primary-dark: #5e4a15;
    --gold:       #c9a13b;
    --gold-soft:  #e3cf8f;
    --vellum:     #f7f2e7;
    --vellum-dim: #ece4d2;
    --ink:        #22243a;
    --green:      #1b4d38;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--vellum); color: var(--ink); font-family: 'Spectral', Georgia, serif; min-height: 100vh; }
  header { background: var(--primary); color: var(--vellum); padding: 2rem 1.5rem 2.4rem; text-align: center; border-bottom: 5px solid var(--gold); }
  header .eyebrow { font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: .4rem; }
  header h1 { font-weight: 500; font-size: clamp(1.3rem, 4vw, 1.9rem); }
  header .ar { font-family: 'Amiri', serif; font-size: 1.1rem; color: var(--gold-soft); margin-top: .3rem; }
  header .sub { font-size: .86rem; color: var(--vellum-dim); margin-top: .5rem; max-width: 620px; margin-left: auto; margin-right: auto; line-height: 1.5; }
  main { max-width: 860px; margin: 1.8rem auto 2.5rem; padding: 0 1.2rem; }
  .ph { text-align: center; padding: 2.4rem 1rem; border: 2px dashed #cbbf9d; border-radius: 16px; background: var(--surface, #fff); }
  .ph .big { font-size: 2.4rem; }
  .ph h2 { font-weight: 500; color: var(--primary); margin: .5rem 0 .4rem; }
  .ph p { font-size: .9rem; color: var(--abd-55544a, #55544a); max-width: 480px; margin: 0 auto; line-height: 1.55; }
  .ph .back { display: inline-block; margin-top: 1rem; font-size: .86rem; color: var(--primary); }
</style>
<link rel="stylesheet" href="../../assets/theme.css">
<script defer src="../../assets/ui.js"></script>
</head>
<body>

<header>
  <div class="eyebrow">Al Baseera Academy · Games</div>
  <h1>Letter Hangman</h1>
  <div class="ar">لُعْبَة الحُرُوف</div>
  <p class="sub"></p>
</header>

<main>
<div class="ph"><div class="big">🪢</div><h2>Coming soon</h2><p>Guess the hidden Arabic word one letter at a time. The word bank will draw from the vocabulary levels, so every round is review.</p><a class="back" href="../vocab-match/">Play Vocab Match while you wait &rarr;</a></div>
</main>

<script>
  var esc = function (t) { return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };

</script>
</body>
</html>
