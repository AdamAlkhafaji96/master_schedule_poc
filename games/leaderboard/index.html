<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — Your Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:      #14555c;
    --primary-dark: #0d3a3f;
    --gold:       #c9a13b;
    --gold-soft:  #e3cf8f;
    --vellum:     #f7f2e7;
    --vellum-dim: #ece4d2;
    --ink:        #22243a;
    --green:      #1b4d38;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--vellum); color: var(--ink); font-family: 'Spectral', Georgia, serif; min-height: 100vh; }
  header { background: var(--primary); color: var(--vellum); padding: 2rem 1.5rem 2.4rem; text-align: center; border-bottom: 5px solid var(--gold); }
  header .eyebrow { font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: .4rem; }
  header h1 { font-weight: 500; font-size: clamp(1.3rem, 4vw, 1.9rem); }
  header .ar { font-family: 'Amiri', serif; font-size: 1.1rem; color: var(--gold-soft); margin-top: .3rem; }
  header .sub { font-size: .86rem; color: var(--vellum-dim); margin-top: .5rem; max-width: 620px; margin-left: auto; margin-right: auto; line-height: 1.5; }
  main { max-width: 860px; margin: 1.8rem auto 2.5rem; padding: 0 1.2rem; }
  .tblwrap { overflow-x: auto; background: var(--surface, #fff); border: 1px solid var(--vellum-dim); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: .86rem; }
  th, td { text-align: left; padding: .55rem .7rem; border-bottom: 1px solid var(--vellum-dim); }
  th { font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); background: #fbf8f0; }
  .empty { text-align: center; padding: 2rem 1rem; color: var(--abd-8a887c, #8a887c); font-style: italic; }
</style>
<link rel="stylesheet" href="../../assets/theme.css">
<script defer src="../../assets/ui.js"></script>
</head>
<body>

<header>
  <div class="eyebrow">Al Baseera Academy · Games</div>
  <h1>Leaderboard</h1>
  <div class="ar">لَوْحَة الصَّدَارَة</div>
  <p class="sub">Your best game scores on this device. Shared class leaderboards arrive with student accounts.</p>
</header>

<main>
<div class="tblwrap"><table>
  <thead><tr><th>Date</th><th>Game</th><th>Deck</th><th>Pairs</th><th>Misses</th></tr></thead>
  <tbody id="rows"></tbody>
</table></div>
<div class="empty" id="empty" style="display:none">No scores yet on this device — go play a round of <a href="../vocab-match/">Vocab Match</a>!</div>
</main>

<script>
  var esc = function (t) { return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
(function () {
  var log = [];
  try { log = JSON.parse(localStorage.getItem('ab-game-scores') || '[]'); } catch (e) {}
  log.sort(function (a, b) { return a.misses - b.misses; });
  if (!log.length) { document.getElementById('empty').style.display = ''; return; }
  document.getElementById('rows').innerHTML = log.slice(0, 25).map(function (r) {
    return '<tr><td>' + esc(r.date) + '</td><td>' + esc(r.game) + '</td><td>' + esc(r.deck) + '</td>' +
      '<td>' + esc(r.pairs) + '</td><td>' + esc(r.misses) + '</td></tr>';
  }).join('');
})();
</script>
</body>
</html>
