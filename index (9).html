<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignments — Al Baseera Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:      #3a3f4d;
    --primary-dark: #262a35;
    --gold:       #c9a13b;
    --gold-soft:  #e3cf8f;
    --vellum:     #f7f2e7;
    --vellum-dim: #ece4d2;
    --ink:        #22243a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--vellum); color: var(--ink); font-family: 'Spectral', Georgia, serif; min-height: 100vh; }
  header { background: var(--primary); color: var(--vellum); padding: 2rem 1.5rem 2.4rem; text-align: center; border-bottom: 5px solid var(--gold); }
  .header-logo { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--gold); display: block; margin: 0 auto .6rem; }
  header .eyebrow { font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: .4rem; }
  header h1 { font-weight: 500; font-size: clamp(1.3rem, 4vw, 1.9rem); }
  .site-nav { margin-top: .8rem; display: flex; gap: 1.4rem; justify-content: center; flex-wrap: wrap; }
  .site-nav a { color: var(--gold-soft); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid rgba(201,161,59,.5); padding-bottom: 2px; }
  .site-nav a:hover { color: #fff; border-color: #fff; }

  main { max-width: 820px; margin: 1.8rem auto 2.6rem; padding: 0 1rem; }
  .intro { text-align: center; color: #6b6d85; font-size: .9rem; margin-bottom: 1.6rem; }
  h2.subject { font-weight: 500; font-size: 1.15rem; letter-spacing: .06em; margin: 1.6rem 0 .7rem; display: flex; align-items: center; gap: .8rem; }
  h2.subject::after { content: ''; flex: 1; height: 1px; background: var(--vellum-dim); }
  .item { background: #fff; border: 1px solid var(--vellum-dim); border-left: 4px solid var(--primary); border-radius: 10px; padding: .9rem 1.1rem; margin-bottom: .6rem; display: flex; gap: .9rem; }
  .item.written    { border-left-color: #1b2a5e; }
  .item.quiz       { border-left-color: #1b4d38; }
  .item.recitation { border-left-color: #4d1b30; }
  .item.worksheet  { border-left-color: #8a6d2f; }
  .item .icon { font-size: 1.4rem; line-height: 1.6; }
  .item .body { flex: 1; }
  .item .kind { font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: #8a6d2f; }
  .item .title { font-weight: 500; }
  .item .desc { font-size: .84rem; color: #6b6d85; margin-top: .15rem; }
  .item .due { font-size: .74rem; color: #9a9cb3; margin-top: .3rem; font-style: italic; }
  .item .row { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .55rem; }
  .item a.act { font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; background: var(--primary); color: var(--vellum); padding: .35rem .9rem; border-radius: 999px; white-space: nowrap; }
  .item a.act.passage { background: #4d1b30; }
  .item .soon { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: #9a9cb3; border: 1px dashed #c8c5ba; padding: .32rem .85rem; border-radius: 999px; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <img class="header-logo" src="../../assets/logo.jpeg" alt="Al Baseera Academy">
  <div class="eyebrow">Al Baseera Academy · General</div>
  <h1>Assignments</h1>
  <nav class="site-nav">
    <a href="../../">Home</a>
    <a href="../materials/">Materials Library</a>
    <a href="../../quran/text/">Quran Reader</a>
  </nav>
</header>

<main>
  <p class="intro">Homework, practice quizzes, recitations, and worksheets by subject. All items below are placeholders — submission lanes open as each type is enabled.</p>
  <div id="list"></div>
</main>

<script>
const ICONS = { written: '✍️', quiz: '❓', recitation: '🎙️', worksheet: '🖨️' };
const KINDS = { written: 'Written Assignment', quiz: 'Practice Quiz', recitation: 'Oral Recitation', worksheet: 'Worksheet' };

fetch('assignments.json').then(r => r.json()).then(d => {
  document.getElementById('list').innerHTML = d.subjects.map(s => `
    <h2 class="subject">${s.name}</h2>
    ${s.items.map(it => {
      const sub = it.submission || { mode: 'none' };
      let action = '';
      if (sub.mode === 'google-form' || sub.mode === 'link') {
        action = `<a class="act" href="${sub.url}" target="_blank" rel="noopener">${sub.label || 'Submit'}</a>`;
      } else if (sub.mode === 'coming-soon') {
        action = `<span class="soon">${sub.label || 'Submissions opening soon'}</span>`;
      }
      const passage = it.passage
        ? `<a class="act passage" href="../../quran/text/${it.passage}">Open in Quran Reader</a>` : '';
      return `
      <div class="item ${it.type}">
        <span class="icon">${ICONS[it.type] || '📄'}</span>
        <div class="body">
          <div class="kind">${KINDS[it.type] || it.type}</div>
          <div class="title">${it.title}</div>
          <div class="desc">${it.desc || ''}</div>
          <div class="due">${it.due || ''}</div>
          <div class="row">${passage}${action}</div>
        </div>
      </div>`;
    }).join('')}
  `).join('');
});
</script>
</body>
</html>
