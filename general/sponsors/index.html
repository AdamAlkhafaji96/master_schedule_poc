<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsors — Partner With Al Baseera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:      #3a3f4d;
    --primary-dark: #262a35;
    --gold:       #c9a13b;
    --gold-soft:  #e3cf8f;
    --vellum:     #f7f2e7;
    --vellum-dim: #ece4d2;
    --ink:        #22243a;
    --green:      #1b4d38;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--vellum); color: var(--ink); font-family: 'Spectral', Georgia, serif; min-height: 100vh; }
  header {
    background: var(--primary); color: var(--vellum);
    padding: 2rem 1.5rem 2.4rem; text-align: center; border-bottom: 5px solid var(--gold);
  }
  header .eyebrow { font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: .4rem; }
  header h1 { font-weight: 500; font-size: clamp(1.3rem, 4vw, 1.9rem); }
  header .ar { font-family: 'Amiri', serif; font-size: 1.05rem; color: var(--gold-soft); margin-top: .3rem; }
  header .sub { font-size: .86rem; color: var(--vellum-dim); margin-top: .5rem; max-width: 620px; margin-left: auto; margin-right: auto; line-height: 1.5; }
  main { max-width: 860px; margin: 1.8rem auto 2.5rem; padding: 0 1.2rem; }
  .note-box {
    background: var(--surface, #fff); border: 1px solid var(--vellum-dim); border-left: 4px solid var(--gold);
    border-radius: 10px; padding: .7rem .9rem; font-size: .84rem; line-height: 1.55;
    color: var(--abd-55544a, #55544a); margin-bottom: 1.2rem;
  }
  h2.sect { font-weight: 600; font-size: 1.05rem; color: var(--primary); margin: 1.4rem 0 .7rem;
    border-bottom: 2px solid var(--gold-soft); padding-bottom: .25rem; }
  .card {
    background: var(--surface, #fff); border: 1px solid var(--vellum-dim); border-radius: 14px;
    box-shadow: 0 1px 3px rgba(34,36,58,.06); padding: 1rem 1.1rem;
  }
  .card.placeholder { border-style: dashed; border-color: #cbbf9d; background: transparent; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .9rem; }
  .kind { font-size: .64rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: .15rem; }
  .muted { color: var(--abd-8a887c, #8a887c); }
  .btn {
    display: inline-block; font: inherit; font-size: .86rem; cursor: pointer; text-decoration: none;
    background: var(--primary); color: var(--vellum); border: 0; border-radius: 999px; padding: .5rem 1.1rem;
  }
  .btn.ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
  .ph-note { font-size: .74rem; color: var(--abd-a08a45, #a08a45); margin-top: .5rem; font-style: italic; }
  .tier-amt { font-weight: 600; color: var(--gold); font-size: 1.05rem; }
  .wall .card { text-align: center; padding: 1.3rem 1rem; }
  .wall .s-name { font-weight: 600; font-size: 1.02rem; color: var(--primary); }
  .wall .s-tier { font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-top: .3rem; }
  .cta { text-align: center; margin: 1.6rem 0 .4rem; }
</style>
<link rel="stylesheet" href="../../assets/theme.css">
<script defer src="../../assets/ui.js"></script>
</head>
<body>

<header>
  <div class="eyebrow">Al Baseera Academy · Support & Partners</div>
  <h1>Our Sponsors</h1>
  
  <p class="sub">Businesses and families who underwrite Islamic education in Houston. Sponsors are honored here and on program pages — lesson content is never sponsored.</p>
</header>

<main>
<div class="note-box" id="policy"></div>
<h2 class="sect">Sponsorship tiers</h2>
<div class="grid" id="tiers"></div>
<h2 class="sect">Sponsor wall</h2>
<div class="grid wall" id="wall"></div>
<div class="cta">
  <a class="btn" id="contactBtn" href="#">Become a sponsor</a>
  <div class="ph-note" id="packet"></div>
</div>
</main>

<script>
  var esc = function (t) { return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
(async function () {
  var D = await (await fetch('sponsors.json')).json();
  document.getElementById('policy').textContent = D.placement_policy;
  document.getElementById('packet').textContent = D.packet_note;
  document.getElementById('contactBtn').href = D.contact;
  document.getElementById('tiers').innerHTML = D.tiers.map(function (t) {
    return '<div class="card"><div class="kind">' + esc(t.name) + '</div>' +
      '<div class="tier-amt">' + esc(t.amount) + '</div>' +
      '<p class="muted" style="font-size:.86rem;margin-top:.35rem;line-height:1.5">' + esc(t.desc) + '</p></div>';
  }).join('');
  var tname = {}; D.tiers.forEach(function (t) { tname[t.id] = t.name; });
  document.getElementById('wall').innerHTML = D.sponsors.map(function (s) {
    var ph = s.status === 'placeholder';
    return '<div class="card' + (ph ? ' placeholder' : '') + '">' +
      '<div class="s-name">' + esc(s.name) + '</div>' +
      '<div class="s-tier">' + esc(tname[s.tier] || s.tier) + '</div>' +
      (s.blurb ? '<p class="muted" style="font-size:.82rem;margin-top:.4rem">' + esc(s.blurb) + '</p>' : '') +
      (ph ? '<div class="ph-note">Placeholder — this spot is waiting for you.</div>' : '') +
    '</div>';
  }).join('');
})();
</script>
</body>
</html>
