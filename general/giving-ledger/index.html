<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giving Ledger — Our Charity Pledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:      #3a3f4d;
    --primary-dark: #262a35;
    --gold:       #c9a13b;
    --gold-soft:  #e3cf8f;
    --vellum:     #f7f2e7;
    --vellum-dim: #ece4d2;
    --ink:        #22243a;
    --green:      #1b4d38;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--vellum); color: var(--ink); font-family: 'Spectral', Georgia, serif; min-height: 100vh; }
  header {
    background: var(--primary); color: var(--vellum);
    padding: 2rem 1.5rem 2.4rem; text-align: center; border-bottom: 5px solid var(--gold);
  }
  header .eyebrow { font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: .4rem; }
  header h1 { font-weight: 500; font-size: clamp(1.3rem, 4vw, 1.9rem); }
  header .ar { font-family: 'Amiri', serif; font-size: 1.05rem; color: var(--gold-soft); margin-top: .3rem; }
  header .sub { font-size: .86rem; color: var(--vellum-dim); margin-top: .5rem; max-width: 620px; margin-left: auto; margin-right: auto; line-height: 1.5; }
  main { max-width: 860px; margin: 1.8rem auto 2.5rem; padding: 0 1.2rem; }
  .note-box {
    background: var(--surface, #fff); border: 1px solid var(--vellum-dim); border-left: 4px solid var(--gold);
    border-radius: 10px; padding: .7rem .9rem; font-size: .84rem; line-height: 1.55;
    color: var(--abd-55544a, #55544a); margin-bottom: 1.2rem;
  }
  h2.sect { font-weight: 600; font-size: 1.05rem; color: var(--primary); margin: 1.4rem 0 .7rem;
    border-bottom: 2px solid var(--gold-soft); padding-bottom: .25rem; }
  .card {
    background: var(--surface, #fff); border: 1px solid var(--vellum-dim); border-radius: 14px;
    box-shadow: 0 1px 3px rgba(34,36,58,.06); padding: 1rem 1.1rem;
  }
  .card.placeholder { border-style: dashed; border-color: #cbbf9d; background: transparent; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .9rem; }
  .kind { font-size: .64rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: .15rem; }
  .muted { color: var(--abd-8a887c, #8a887c); }
  .btn {
    display: inline-block; font: inherit; font-size: .86rem; cursor: pointer; text-decoration: none;
    background: var(--primary); color: var(--vellum); border: 0; border-radius: 999px; padding: .5rem 1.1rem;
  }
  .btn.ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
  .ph-note { font-size: .74rem; color: var(--abd-a08a45, #a08a45); margin-top: .5rem; font-style: italic; }
  .pledge { background: var(--green); color: var(--vellum); border-radius: 14px; padding: 1.1rem 1.2rem; margin-bottom: 1.2rem; }
  .pledge .kind { color: var(--gold-soft); }
  .pledge p { line-height: 1.55; font-size: .95rem; }
  .pledge .floor { font-size: .82rem; color: var(--vellum-dim); margin-top: .5rem; }
  .tblwrap { overflow-x: auto; background: var(--surface, #fff); border: 1px solid var(--vellum-dim); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: .86rem; }
  th, td { text-align: left; padding: .55rem .7rem; border-bottom: 1px solid var(--vellum-dim); }
  th { font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); background: #fbf8f0; }
  tr.placeholder td { color: var(--abd-9a9cb3, #9a9cb3); font-style: italic; }
  .pstat { font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: .15rem .5rem; border: 1px solid var(--vellum-dim); }
  .pstat.transferred { color: var(--green); border-color: var(--green); }
  .partner-row a { color: var(--primary); }
</style>
<link rel="stylesheet" href="../../assets/theme.css">
<script defer src="../../assets/ui.js"></script>
</head>
<body>

<header>
  <div class="eyebrow">Al Baseera Academy · Support & Partners</div>
  <h1>Giving Ledger</h1>
  
  <p class="sub">Every month we publish what the revenue pledge sent to our charity partners — the receipt trail, in public.</p>
</header>

<main>
<div class="pledge">
  <div class="kind">The pledge</div>
  <p id="pledge"></p>
  <div class="floor" id="floor"></div>
</div>
<div class="note-box" id="zakat"></div>
<h2 class="sect">Charity partners</h2>
<div class="grid" id="partners"></div>
<h2 class="sect">Monthly ledger</h2>
<div class="tblwrap"><table>
  <thead><tr><th>Period</th><th>Supporters</th><th>Pledged</th><th>Recipient</th><th>Transferred</th><th>Status</th></tr></thead>
  <tbody id="rows"></tbody>
</table></div>
</main>

<script>
  var esc = function (t) { return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
(async function () {
  var D = await (await fetch('ledger.json')).json();
  document.getElementById('pledge').textContent = D.pledge;
  document.getElementById('floor').textContent = D.floor;
  document.getElementById('zakat').textContent = D.zakat_note;
  document.getElementById('partners').innerHTML = D.partners.map(function (p) {
    return '<div class="card partner-row"><div class="kind">' + esc(p.kind) + '</div>' +
      '<a href="' + esc(p.url) + '" target="_blank" rel="noopener" style="font-weight:600">' + esc(p.name) + ' &rarr;</a></div>';
  }).join('');
  document.getElementById('rows').innerHTML = D.months.map(function (m) {
    var ph = m.status === 'placeholder';
    return '<tr' + (ph ? ' class="placeholder"' : '') + '>' +
      '<td>' + esc(m.period) + '</td><td>' + esc(m.units) + '</td><td>' + esc(m.pledged) + '</td>' +
      '<td>' + esc(m.recipient) + '</td><td>' + esc(m.transferred || '—') + '</td>' +
      '<td><span class="pstat ' + esc(m.status) + '">' + esc(m.status) + '</span></td></tr>';
  }).join('');
})();
</script>
</body>
</html>
