<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accreditation & Certifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:      #3a3f4d;
    --primary-dark: #262a35;
    --gold:       #c9a13b;
    --gold-soft:  #e3cf8f;
    --vellum:     #f7f2e7;
    --vellum-dim: #ece4d2;
    --ink:        #22243a;
    --green:      #1b4d38;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--vellum); color: var(--ink); font-family: 'Spectral', Georgia, serif; min-height: 100vh; }
  header {
    background: var(--primary); color: var(--vellum);
    padding: 2rem 1.5rem 2.4rem; text-align: center; border-bottom: 5px solid var(--gold);
  }
  .header-logo {
    width: 54px; height: 54px; border-radius: 50%;
    border: 2px solid var(--gold);
    display: block; margin: 0 auto .6rem;
  }
  header .eyebrow { font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: .4rem; }
  header h1 { font-weight: 500; font-size: clamp(1.3rem, 4vw, 1.9rem); }
  .site-nav { margin-top: .8rem; display: flex; gap: 1.4rem; justify-content: center; flex-wrap: wrap; }
  .site-nav a { color: var(--gold-soft); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid rgba(201,161,59,.5); padding-bottom: 2px; }
  .site-nav a:hover { color: #fff; border-color: #fff; }
  main { max-width: 760px; margin: 2rem auto 2.5rem; padding: 0 1.2rem; }
  .card {
    background: #fff; border: 1px solid var(--vellum-dim); border-radius: 14px;
    box-shadow: 0 1px 3px rgba(34,36,58,.06); margin-bottom: 1rem; padding: 1rem 1.15rem 1.05rem;
  }
  .card.ph { border-style: dashed; border-color: #cbbf9d; background: #fbf8f0; }
  .card h2 { font-weight: 600; font-size: 1.08rem; color: var(--primary); }
  .card .sub { font-size: .78rem; color: #8a887c; font-style: italic; }
  .card p { font-size: .9rem; color: #55544a; line-height: 1.55; margin-top: .45rem; }
  .badge {
    font-size: .64rem; letter-spacing: .14em; text-transform: uppercase;
    border-radius: 999px; padding: .14rem .55rem; border: 1px solid var(--gold-soft);
    color: #a08a45; background: #fbf8f0; margin-left: .5rem; vertical-align: middle;
  }
  .act a {
    display: inline-block; margin-top: .7rem; font-size: .88rem; font-weight: 600;
    color: #fff; background: var(--green); border-radius: 8px;
    padding: .45rem 1rem; text-decoration: none;
  }
  .act a:hover { background: #14563c; }
  .note { font-size: .8rem; color: #6b6a60; text-align: center; margin-top: 1.2rem; line-height: 1.55; }
  footer { text-align: center; padding: 0 1.2rem 2.2rem; font-size: .78rem; color: #8a887c; line-height: 1.5; }
  .st { font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; border-radius:999px; padding:.14rem .55rem; border:1px solid; margin-left:.5rem; vertical-align:middle; }
  .st.accredited { color:#1b4d38; border-color:#a9c9b4; background:#f2f7f2; }
  .st.pursuing { color:#a05a00; border-color:#eac48a; background:#fdf5e6; }
  .st.researching { color:#6b5a9e; border-color:#c9bfe3; background:#f5f2fb; }
  .st.placeholder { color:#a08a45; border-color:var(--gold-soft); background:#fbf8f0; }
  .card a.ext { color: var(--primary); font-weight:600; font-size:.84rem; text-decoration:none; border-bottom:1px solid var(--gold-soft); }
</style>
</head>
<body>
<header>
  <img class="header-logo" src="../../assets/logo.jpeg" alt="Al Baseera Academy">
  <div class="eyebrow">General</div>
  <h1>Accreditation<br><span style="font-family:'Amiri',serif;font-size:1.2rem;color:var(--gold)">الاعتماد الأكاديمي</span></h1>
  <div class="site-nav"><a href="../diagnostic/">Diagnostic Exam</a><a href="../../about/academy/">About</a><a href="../../">Home</a></div>
</header>
<main>
<p class="note" id="intro" style="margin:0 0 1.2rem"></p><div id="host">Loading…</div>
</main>
<footer>Statuses reflect the school’s own tracking, not claims of current accreditation, unless marked accredited.</footer>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
(async function(){
  const D = await (await fetch('accreditation.json')).json();
  document.getElementById('intro').textContent = D.intro || '';
  document.getElementById('host').innerHTML = D.tracks.map(t =>
    '<div class="card' + (t.status === 'placeholder' ? ' ph' : '') + '">' +
      '<h2>' + esc(t.org) + '<span class="st ' + esc(t.status) + '">' + esc(t.status) + '</span></h2>' +
      '<div class="sub">' + esc(t.scope) + '</div>' +
      '<p>' + esc(t.desc) + '</p>' +
      (t.url ? '<a class="ext" href="' + esc(t.url) + '" target="_blank" rel="noopener">Learn more ↗</a>' : '') +
    '</div>').join('');
})();
</script>
</body>
</html>
