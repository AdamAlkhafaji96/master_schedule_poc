<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Islamic Studies — Topics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1b4d38; --primary-dark: #0f3324;
    --gold: #c9a13b; --gold-soft: #e3cf8f;
    --vellum: #f7f2e7; --vellum-dim: #ece4d2; --ink: #22243a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--vellum); color: var(--ink); font-family: 'Spectral', Georgia, serif; min-height: 100vh; }
  header { background: var(--primary); color: var(--vellum); padding: 2rem 1.5rem 2.4rem; text-align: center; border-bottom: 5px solid var(--gold); }
  .header-logo { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--gold); display: block; margin: 0 auto .6rem; }
  header .eyebrow { font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: .4rem; }
  header h1 { font-weight: 500; font-size: clamp(1.3rem, 4vw, 1.9rem); }
  .site-nav { margin-top: .8rem; display: flex; gap: 1.4rem; justify-content: center; flex-wrap: wrap; }
  .site-nav a { color: var(--gold-soft); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid rgba(201,161,59,.5); padding-bottom: 2px; }
  .site-nav a:hover { color: #fff; border-color: #fff; }
  .controls {
    max-width: 620px; margin: -1.2rem auto 0; background: var(--primary-dark);
    border: 1px solid rgba(201,161,59,.45); border-radius: 14px; padding: .9rem 1.2rem;
    display: flex; flex-wrap: wrap; gap: .7rem; justify-content: center;
    position: relative; z-index: 2; box-shadow: 0 10px 30px rgba(15,51,36,.25);
  }
  .controls select { font-family: inherit; font-size: .92rem; padding: .5rem .7rem; border-radius: 8px; border: 1px solid var(--gold); background: var(--vellum); color: var(--ink); }
  main { max-width: 720px; margin: 1.8rem auto 2.5rem; padding: 0 1.2rem; }
  .topic-head { text-align: center; margin-bottom: 1.1rem; }
  .topic-head h2 { font-weight: 600; font-size: 1.3rem; color: var(--primary); }
  .topic-head .ar { font-family: 'Amiri', serif; font-size: 1.4rem; color: var(--gold); }
  .topic-head .blurb { font-size: .9rem; color: #6b6a60; margin-top: .3rem; line-height: 1.5; }
  .lvl { font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: #6b5a9e;
    border: 1px solid #c9bfe3; background: #f5f2fb; border-radius: 999px; padding: .12rem .55rem; }
  .sec { background: #fff; border: 1px solid var(--vellum-dim); border-radius: 14px;
    box-shadow: 0 1px 3px rgba(34,36,58,.06); margin-bottom: .8rem; padding: .95rem 1.1rem 1rem; }
  .sec.ph { border-style: dashed; border-color: #cbbf9d; background: #fbf8f0; }
  .sec h3 { font-weight: 600; font-size: 1rem; color: var(--primary); }
  .sec p { font-size: .9rem; color: #55544a; line-height: 1.55; margin-top: .4rem; }
  .sec.ph p { color: #a08a45; font-style: italic; }
  .note { font-size: .8rem; color: #6b6a60; text-align: center; margin-top: 1.1rem; line-height: 1.55; }
  footer { text-align: center; padding: 0 1.2rem 2.2rem; font-size: .78rem; color: #8a887c; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <img class="header-logo" src="../../assets/logo.jpeg" alt="Al Baseera Academy">
  <div class="eyebrow">Islamic Studies</div>
  <h1>Topics<br><span style="font-family:'Amiri',serif;font-size:1.2rem;color:var(--gold)">مواضيع الدراسات الإسلامية</span></h1>
  <div class="site-nav">
    <a href="../stories/">Stories</a>
    <a href="../wudu/">Wudu</a>
    <a href="../../">Home</a>
  </div>
</header>

<div class="controls">
  <select id="topicSel" aria-label="Choose topic"></select>
</div>

<main>
  <div class="topic-head" id="topicHead"></div>
  <div id="host"></div>
  <p class="note">Dashed sections are placeholders holding each lesson's outline —
  the teacher's content replaces them section by section in topics.json.</p>
</main>

<footer>One template, many topics — new topics are one JSON entry away.</footer>

<script>
let D = null, cur = 0;
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render() {
  const t = D.topics[cur];
  document.getElementById('topicHead').innerHTML =
    '<h2>' + esc(t.en) + ' <span class="lvl">Level ' + (t.level || 1) + '</span></h2>' +
    '<div class="ar">' + esc(t.ar) + '</div>' +
    '<div class="blurb">' + esc(t.blurb) + '</div>';
  document.getElementById('host').innerHTML = t.sections.map(s =>
    '<div class="sec' + (s.status === 'placeholder' ? ' ph' : '') + '">' +
      '<h3>' + esc(s.title) + '</h3><p>' + esc(s.body) + '</p></div>').join('');
  history.replaceState(null, '', '?t=' + t.id);
}

(async function init() {
  D = await (await fetch('topics.json')).json();
  const want = new URLSearchParams(location.search).get('t');
  const i = D.topics.findIndex(t => t.id === want);
  if (i >= 0) cur = i;
  const sel = document.getElementById('topicSel');
  sel.innerHTML = D.topics.map((t, j) =>
    '<option value="' + j + '">' + esc(t.en) + '</option>').join('');
  sel.value = cur;
  sel.addEventListener('change', e => { cur = parseInt(e.target.value); render(); });
  render();
})();
</script>
</body>
</html>
