<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 99 Names of Allah — Asma ul-Husna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:      #1b4d38;
    --primary-dark: #0f3324;
    --gold:       #c9a13b;
    --gold-soft:  #e3cf8f;
    --vellum:     #f7f2e7;
    --vellum-dim: #ece4d2;
    --ink:        #22243a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--vellum); color: var(--ink); font-family: 'Spectral', Georgia, serif; min-height: 100vh; }
  header {
    background: var(--primary); color: var(--vellum);
    padding: 2rem 1.5rem 2.4rem; text-align: center; border-bottom: 5px solid var(--gold);
  }
  .header-logo {
    width: 54px; height: 54px; border-radius: 50%;
    border: 2px solid var(--gold);
    display: block; margin: 0 auto .6rem;
  }
  header .eyebrow { font-size: .78rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: .4rem; }
  header h1 { font-weight: 500; font-size: clamp(1.3rem, 4vw, 1.9rem); }
  header .arabic-title { font-family: 'Amiri', serif; font-size: 1.5rem; color: var(--gold-soft); margin-top: .3rem; }
  .site-nav { margin-top: .8rem; display: flex; gap: 1.4rem; justify-content: center; flex-wrap: wrap; }
  .site-nav a { color: var(--gold-soft); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid rgba(201,161,59,.5); padding-bottom: 2px; }
  .site-nav a:hover { color: #fff; border-color: #fff; }

  .controls {
    max-width: 760px; margin: -1.2rem auto 0;
    background: var(--primary-dark); border: 1px solid rgba(201,161,59,.45);
    border-radius: 14px; padding: .9rem 1.2rem;
    display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; justify-content: center;
    position: relative; z-index: 2; box-shadow: 0 10px 30px rgba(15,51,36,.25);
  }
  .controls input[type=search] {
    flex: 1; min-width: 200px; font-family: inherit; font-size: .92rem;
    padding: .5rem .8rem; border-radius: 999px; border: 1px solid var(--gold);
    background: var(--vellum); color: var(--ink);
  }

  main { max-width: 860px; margin: 1.6rem auto 2.5rem; padding: 0 1.2rem; }
  .names {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: .8rem;
  }
  .name-card {
    background: #fff; border: 1px solid var(--vellum-dim); border-radius: 12px;
    padding: 1rem 1rem .9rem; text-align: center;
    box-shadow: 0 1px 3px rgba(34,36,58,.06);
    transition: border-color .12s, box-shadow .12s;
    position: relative;
  }
  .name-card:hover { border-color: var(--gold); box-shadow: 0 4px 12px rgba(34,36,58,.1); }
  .name-card .num {
    position: absolute; top: .55rem; left: .7rem;
    font-size: .72rem; color: var(--gold); font-weight: 600; letter-spacing: .06em;
  }
  .name-card .arabic { font-family: 'Amiri', serif; font-size: 2rem; color: var(--primary); line-height: 1.3; }
  .name-card .translit { font-size: .98rem; font-weight: 600; margin-top: .15rem; letter-spacing: .02em; }
  .name-card .meaning { font-size: .85rem; color: #55544a; margin-top: .1rem; }

  .pager { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: 1.4rem; }
  .pager-btn {
    background: transparent; border: 1px solid var(--primary); color: var(--primary);
    border-radius: 999px; width: 42px; height: 42px; font-size: 1.15rem;
    font-family: inherit; cursor: pointer; transition: background .12s, color .12s, opacity .12s;
  }
  .pager-btn:hover:not(:disabled) { background: var(--primary); color: #fff; }
  .pager-btn:disabled { opacity: .3; cursor: default; }
  .pager-label { min-width: 96px; text-align: center; font-size: .92rem; letter-spacing: .06em; color: var(--primary); font-weight: 600; }
  .empty { text-align: center; color: #6b6a60; padding: 2rem 0; }
  footer { text-align: center; font-size: .78rem; color: #8a887c; padding: 0 1rem 2.5rem; }
  @media (prefers-reduced-motion: reduce) { .name-card, .pager-btn { transition: none; } }
</style>
</head>
<body>

<header>
  <img class="header-logo" src="../../assets/logo.jpeg" alt="Al Baseera Academy">
  <div class="eyebrow">Islamic Studies</div>
  <h1>The 99 Names of Allah</h1>
  <div class="arabic-title">أسماء الله الحسنى</div>
  <div class="site-nav">
    <a href="../prophets-and-imams/">Prophets &amp; Imams</a>
    <a href="../../quran/text/">Quran</a>
    <a href="../../">Home</a>
  </div>
</header>

<div class="controls">
  <input type="search" id="searchBox" placeholder="Search by name or meaning… (e.g. Rahman, mercy)" aria-label="Search names">
</div>

<main>
  <div class="names" id="nameGrid"></div>
  <p class="empty" id="empty" style="display:none">No names match that search.</p>
  <div class="pager" id="pager">
    <button class="pager-btn" id="prevPage" aria-label="Previous page">&larr;</button>
    <span class="pager-label" id="pageLabel"></span>
    <button class="pager-btn" id="nextPage" aria-label="Next page">&rarr;</button>
  </div>
</main>

<footer>Asma ul-Husna — the beautiful names, as traditionally enumerated.</footer>

<script>
const NAMES = [
["ٱلرَّحْمَـٰنُ","Ar-Rahman","The Most Merciful"],
["ٱلرَّحِيمُ","Ar-Raheem","The Bestower of Mercy"],
["ٱلْمَلِكُ","Al-Malik","The King"],
["ٱلْقُدُّوسُ","Al-Quddus","The Most Holy"],
["ٱلسَّلَامُ","As-Salam","The Source of Peace"],
["ٱلْمُؤْمِنُ","Al-Mu'min","The Giver of Faith and Security"],
["ٱلْمُهَيْمِنُ","Al-Muhaymin","The Guardian"],
["ٱلْعَزِيزُ","Al-Aziz","The Almighty"],
["ٱلْجَبَّارُ","Al-Jabbar","The Compeller"],
["ٱلْمُتَكَبِّرُ","Al-Mutakabbir","The Supreme"],
["ٱلْخَالِقُ","Al-Khaliq","The Creator"],
["ٱلْبَارِئُ","Al-Bari","The Originator"],
["ٱلْمُصَوِّرُ","Al-Musawwir","The Fashioner"],
["ٱلْغَفَّارُ","Al-Ghaffar","The Constant Forgiver"],
["ٱلْقَهَّارُ","Al-Qahhar","The Subduer"],
["ٱلْوَهَّابُ","Al-Wahhab","The Supreme Bestower"],
["ٱلرَّزَّاقُ","Ar-Razzaq","The Provider"],
["ٱلْفَتَّاحُ","Al-Fattah","The Supreme Opener"],
["ٱلْعَلِيمُ","Al-Alim","The All-Knowing"],
["ٱلْقَابِضُ","Al-Qabid","The Withholder"],
["ٱلْبَاسِطُ","Al-Basit","The Extender"],
["ٱلْخَافِضُ","Al-Khafid","The Reducer"],
["ٱلرَّافِعُ","Ar-Rafi","The Exalter"],
["ٱلْمُعِزُّ","Al-Mu'izz","The Honourer"],
["ٱلْمُذِلُّ","Al-Mudhill","The Dishonourer"],
["ٱلسَّمِيعُ","As-Sami","The All-Hearing"],
["ٱلْبَصِيرُ","Al-Basir","The All-Seeing"],
["ٱلْحَكَمُ","Al-Hakam","The Judge"],
["ٱلْعَدْلُ","Al-Adl","The Utterly Just"],
["ٱللَّطِيفُ","Al-Latif","The Subtle One"],
["ٱلْخَبِيرُ","Al-Khabir","The All-Aware"],
["ٱلْحَلِيمُ","Al-Halim","The Most Forbearing"],
["ٱلْعَظِيمُ","Al-Azim","The Magnificent"],
["ٱلْغَفُورُ","Al-Ghafur","The Great Forgiver"],
["ٱلشَّكُورُ","Ash-Shakur","The Most Appreciative"],
["ٱلْعَلِيُّ","Al-Ali","The Most High"],
["ٱلْكَبِيرُ","Al-Kabir","The Most Great"],
["ٱلْحَفِيظُ","Al-Hafiz","The Preserver"],
["ٱلْمُقِيتُ","Al-Muqit","The Sustainer"],
["ٱلْحَسِيبُ","Al-Hasib","The Reckoner"],
["ٱلْجَلِيلُ","Al-Jalil","The Majestic"],
["ٱلْكَرِيمُ","Al-Karim","The Most Generous"],
["ٱلرَّقِيبُ","Ar-Raqib","The Watchful"],
["ٱلْمُجِيبُ","Al-Mujib","The Responsive One"],
["ٱلْوَاسِعُ","Al-Wasi","The All-Encompassing"],
["ٱلْحَكِيمُ","Al-Hakim","The All-Wise"],
["ٱلْوَدُودُ","Al-Wadud","The Most Loving"],
["ٱلْمَجِيدُ","Al-Majid","The Glorious"],
["ٱلْبَاعِثُ","Al-Ba'ith","The Resurrector"],
["ٱلشَّهِيدُ","Ash-Shahid","The All-Witnessing"],
["ٱلْحَقُّ","Al-Haqq","The Absolute Truth"],
["ٱلْوَكِيلُ","Al-Wakil","The Trustee"],
["ٱلْقَوِيُّ","Al-Qawiyy","The All-Strong"],

["ٱلْحَمِيدُ","Al-Hamid","The Praiseworthy"],
["ٱلْمُحْصِي","Al-Muhsi","The All-Enumerating"],
["ٱلْمُبْدِئُ","Al-Mubdi","The Originator"],
["ٱلْمُعِيدُ","Al-Mu'id","The Restorer"],
["ٱلْمُحْيِي","Al-Muhyi","The Giver of Life"],
["ٱلْمُمِيتُ","Al-Mumit","The Bringer of Death"],
["ٱلْحَيُّ","Al-Hayy","The Ever-Living"],
["ٱلْقَيُّومُ","Al-Qayyum","The Sustainer of All"],
["ٱلْوَاجِدُ","Al-Wajid","The Perceiver"],
["ٱلْمَاجِدُ","Al-Majid","The Illustrious"],
["ٱلْوَاحِدُ","Al-Wahid","The One"],
["ٱلْأَحَدُ","Al-Ahad","The Unique"],
["ٱلصَّمَدُ","As-Samad","The Eternal Refuge"],
["ٱلْقَادِرُ","Al-Qadir","The Capable"],
["ٱلْمُقْتَدِرُ","Al-Muqtadir","The Omnipotent"],
["ٱلْمُقَدِّمُ","Al-Muqaddim","The Expediter"],
["ٱلْمُؤَخِّرُ","Al-Mu'akhkhir","The Delayer"],
["ٱلْأَوَّلُ","Al-Awwal","The First"],
["ٱلْآخِرُ","Al-Akhir","The Last"],
["ٱلظَّاهِرُ","Az-Zahir","The Manifest"],
["ٱلْبَاطِنُ","Al-Batin","The Hidden"],
["ٱلْوَالِي","Al-Wali","The Governor"],
["ٱلْمُتَعَالِي","Al-Muta'ali","The Self-Exalted"],
["ٱلْبَرُّ","Al-Barr","The Source of Goodness"],
["ٱلتَّوَّابُ","At-Tawwab","The Ever-Accepting of Repentance"],
["ٱلْمُنْتَقِمُ","Al-Muntaqim","The Avenger"],
["ٱلْعَفُوُّ","Al-Afuww","The Pardoner"],
["ٱلرَّءُوفُ","Ar-Ra'uf","The Most Kind"],
["مَالِكُ ٱلْمُلْكِ","Malik-ul-Mulk","Master of the Kingdom"],
["ذُو ٱلْجَلَالِ وَٱلْإِكْرَامِ","Dhul-Jalali wal-Ikram","Possessor of Majesty and Honour"],
["ٱلْمُقْسِطُ","Al-Muqsit","The Equitable"],
["ٱلْجَامِعُ","Al-Jami","The Gatherer"],
["ٱلْغَنِيُّ","Al-Ghaniyy","The Self-Sufficient"],
["ٱلْمُغْنِي","Al-Mughni","The Enricher"],
["ٱلْمَانِعُ","Al-Mani","The Withholder"],
["ٱلضَّارُّ","Ad-Darr","The Distresser"],
["ٱلنَّافِعُ","An-Nafi","The Benefactor"],
["ٱلنُّورُ","An-Nur","The Light"],
["ٱلْهَادِي","Al-Hadi","The Guide"],
["ٱلْبَدِيعُ","Al-Badi","The Incomparable Originator"],
["ٱلْبَاقِي","Al-Baqi","The Everlasting"],
["ٱلْوَارِثُ","Al-Warith","The Inheritor"],
["ٱلرَّشِيدُ","Ar-Rashid","The Guide to the Right Path"],
["ٱلصَّبُورُ","As-Sabur","The Most Patient"]
];

const PAGE_SIZE = 20;
let page = 0, filter = '';

function filtered() {
  if (!filter) return NAMES.map((n, i) => [i + 1, ...n]);
  const q = filter.toLowerCase();
  return NAMES.map((n, i) => [i + 1, ...n])
    .filter(([num, ar, tr, en]) =>
      tr.toLowerCase().includes(q) || en.toLowerCase().includes(q) || String(num) === q);
}

function render() {
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  page = Math.max(0, Math.min(pages - 1, page));
  const slice = list.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);

  document.getElementById('nameGrid').innerHTML = slice.map(([num, ar, tr, en]) =>
    '<div class="name-card">' +
      '<span class="num">' + num + '</span>' +
      '<div class="arabic">' + ar + '</div>' +
      '<div class="translit">' + tr + '</div>' +
      '<div class="meaning">' + en + '</div>' +
    '</div>').join('');

  document.getElementById('empty').style.display = list.length ? 'none' : '';
  document.getElementById('pager').style.display = list.length > PAGE_SIZE ? '' : 'none';
  document.getElementById('pageLabel').textContent = 'Page ' + (page + 1) + ' of ' + pages;
  document.getElementById('prevPage').disabled = page === 0;
  document.getElementById('nextPage').disabled = page === pages - 1;
}

document.getElementById('searchBox').addEventListener('input', (e) => {
  filter = e.target.value.trim();
  page = 0;
  render();
});
document.getElementById('prevPage').addEventListener('click', () => { page--; render(); });
document.getElementById('nextPage').addEventListener('click', () => { page++; render(); });
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft')  { page--; render(); }
  if (e.key === 'ArrowRight') { page++; render(); }
});
render();
</script>
</body>
</html>
