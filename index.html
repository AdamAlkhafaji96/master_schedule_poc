<!DOCTYPE html>
<html lang="en" data-ab-home>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Baseera Academy — Learning Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
:root {
    --slate:    #3a3f4d;
    --lapis:    #1b2a5e;
    --green:    #1b4d38;
    --burgundy: #4d1b30;
    --gold:     #c9a13b;
    --gold-soft:#e3cf8f;
    --vellum:   #f7f2e7;
    --vellum-dim:#ece4d2;
    --ink:      #22243a;
  }

* { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--vellum);
    color: var(--ink);
    font-family: 'Spectral', Georgia, serif;
    min-height: 100vh;
  }


  header {
    text-align: center;
    padding: 2.4rem 1.5rem 2.2rem;
  }

  header .logo {
    width: clamp(120px, 22vw, 168px);
    height: auto;
    border-radius: 50%;
    border: 3px solid var(--gold);
    box-shadow: 0 6px 22px rgba(34,36,58,.18);
    margin-bottom: 1rem;
  }

  header .bismillah {
    font-family: 'Amiri', serif;
    font-size: 1.6rem;
    color: var(--gold);
    margin-bottom: .8rem;
  }

  header h1 {
    font-weight: 500;
    font-size: clamp(1.6rem, 5vw, 2.3rem);
    letter-spacing: .02em;
  }

  header p {
    color: var(--abd-6b6a60, #6b6a60);
    margin-top: .4rem;
    font-size: .95rem;
    letter-spacing: .04em;
  }


  /* ---- Connect panel ---- */
  .connect { max-width: 900px; margin: 0 auto .9rem; padding: 0 1.2rem; }

  .connect-inner {
    background: var(--surface, #fff); border: 1px solid var(--vellum-dim); border-radius: 12px;
    box-shadow: 0 1px 6px rgba(34,36,58,.06);
    padding: .5rem .9rem .55rem;
    display: flex; flex-wrap: wrap; gap: .45rem 1.3rem; justify-content: center; align-items: center;
  }

  .connect-group { display: flex; flex-direction: column; align-items: center; gap: .3rem; }
  .connect-group + .connect-group { border-left: 1px solid var(--vellum-dim); padding-left: 1.3rem; }

  .connect-group .cg-title {
    font-size: .58rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--abd-6b6a60, #6b6a60); white-space: nowrap;
  }

  .connect-icons { display: flex; gap: .4rem; justify-content: center; }

  .app-icon {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 8px;
    box-shadow: 0 1px 3px rgba(34,36,58,.2), inset 0 -1px 2px rgba(0,0,0,.1);
    transition: transform .1s, box-shadow .1s;
  }

  .app-icon:hover { transform: translateY(-1px) scale(1.08); box-shadow: 0 3px 8px rgba(34,36,58,.28); }

  .app-icon svg { width: 16px; height: 16px; display: block; }

  .app-label { display: none; }


  /* ---- Announcements ---- */
  .announce { max-width: 900px; margin: 0 auto 1.8rem; padding: 0 1.2rem; }

  .announce-title {
    text-align: left; font-weight: 500; font-size: 1.15rem; color: var(--green);
    letter-spacing: .05em; margin-bottom: .8rem; cursor: pointer; list-style: none;
    -webkit-user-select: none; user-select: none;
  }
  .announce-title::-webkit-details-marker { display: none; }
  .announce-title .ab-ic { color: var(--green); }
  .announce-title .achev { display: inline-block; font-size: .8rem; color: var(--gold);
    transition: transform .18s; vertical-align: .08em; margin-left: .25rem; }
  details.announce-fold[open] .announce-title .achev { transform: rotate(90deg); }
  .post.static summary { cursor: default; pointer-events: none; }

  .post {
    background: var(--surface, #fff); border: 1px solid var(--vellum-dim); border-radius: 14px;
    box-shadow: 0 1px 3px rgba(34,36,58,.06); margin-bottom: .7rem; overflow: hidden;
  }

  .post summary {
    list-style: none; cursor: pointer; padding: .8rem 1rem;
    display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap;
  }

  .post summary::-webkit-details-marker { display: none; }

  .post summary:hover { background: #fbf8f0; }

  .post .p-title { font-weight: 600; font-size: .98rem; }

  .post .p-pin {
    font-size: .62rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--gold); border: 1px solid var(--gold-soft); border-radius: 999px; padding: .1rem .5rem;
  }

  .post .p-date { margin-left: auto; font-size: .76rem; color: var(--abd-8a887c, #8a887c); white-space: nowrap; }

  .post .p-body {
    padding: 0 1rem .9rem; border-top: 1px dashed var(--vellum-dim);
    font-size: .9rem; line-height: 1.55; color: var(--abd-44435a, #44435a);
  }

  .post .p-body p { margin-top: .7rem; }

  .post .p-author { font-size: .76rem; color: var(--abd-8a887c, #8a887c); font-style: italic; margin-top: .6rem; }


  .season-banner {
    max-width: 900px; margin: 0 auto 1.6rem; padding: 0 1.2rem;
  }

  .season-inner {
    background: linear-gradient(135deg, #14555c, #0d3a3f 60%, #14555c);
    border: 1px solid rgba(201,161,59,.5);
    border-radius: 16px;
    color: var(--vellum);
    padding: 1.15rem 1.4rem;
    box-shadow: 0 6px 20px rgba(13,58,63,.25);
  }

  .season-month {
    font-size: .74rem; letter-spacing: .24em; text-transform: uppercase;
    color: var(--gold-soft);
  }

  .season-theme { font-size: 1.05rem; margin-top: .2rem; }

  .season-links { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .75rem; }

  .season-links a {
    font-size: .82rem; letter-spacing: .04em; text-decoration: none;
    color: var(--gold-soft); border: 1px solid var(--gold);
    border-radius: 999px; padding: .38rem 1rem;
    transition: background .12s, color .12s;
  }

  .season-links a:hover { background: var(--gold); color: var(--primary-dark, #0f3324); }

  .season-links a:focus-visible { outline: 2px solid var(--vellum); outline-offset: 2px; }


  footer {
    text-align: center; font-size: .78rem; color: var(--abd-8a887c, #8a887c); padding: 0 1rem 2.5rem;
  }


  /* ——— masthead, gilded tabs, cards (UI refresh) ——— */
  .masthead { position: sticky; top: 0; z-index: 80; background: var(--vellum); border-bottom: 1px solid var(--vellum-dim); }
  .mast-row { max-width: 1020px; margin: 0 auto; padding: 1rem 1rem .75rem; display: flex; align-items: center; gap: .9rem; }
  .mast-row .mini { width: clamp(52px, 7vw, 68px); height: clamp(52px, 7vw, 68px); border-radius: 50%; border: 2px solid var(--gold); overflow: hidden; flex: none; background: var(--surface, #fff); display: grid; place-items: center; }
  .mast-row .mini img, .mast-row .mini svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mast-row .wm { line-height: 1.25; padding: .1rem 0; }
  .mast-row .wm .en { font-weight: 600; font-size: clamp(1.25rem, 3vw, 1.7rem); }
  .mast-row .wm .ar { font-family: 'Amiri', serif; font-size: clamp(.95rem, 2vw, 1.15rem); color: var(--gold); margin-top: .25rem; }
  .mast-actions { margin-left: auto; display: flex; gap: .4rem; align-items: center; }
  .tabsrow { max-width: 1020px; margin: 0 auto; padding: 0 1rem; display: flex; gap: .35rem; overflow-x: auto; scrollbar-width: none; }
  .tabsrow::-webkit-scrollbar { display: none; }
  @media (max-width: 899px) {
    .tabsrow { -webkit-mask-image: linear-gradient(90deg, #000 90%, transparent); mask-image: linear-gradient(90deg, #000 90%, transparent); padding-right: 2rem; }
  }
  .mtab { font: inherit; font-size: .88rem; cursor: pointer; white-space: nowrap; background: var(--surface, #fff); color: var(--ab-muted, #6b6d85); border: 1px solid var(--vellum-dim); border-bottom: none; border-radius: 10px 10px 0 0; padding: .48rem .9rem .5rem; display: inline-flex; align-items: center; gap: .45rem; position: relative; top: 1px; }
  html[data-theme="dark"] .mtab { background: var(--ab-surface); }
  .mtab[aria-selected="true"] { color: #f7f2e7; font-weight: 600; background: var(--tabc, var(--gold)); border-color: var(--tabc, var(--gold)); border-top-width: 3px; border-top-color: var(--gold); }
  .mtab[aria-selected="true"] .ab-ic { color: var(--gold-soft, #e3cf8f); }
  .mtab[aria-selected="true"]::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--tabc, var(--gold)); }

  main { max-width: 1020px; margin: 1.1rem auto 2.4rem; padding: 0 1rem; }
  details.pane-wrap > summary { list-style: none; cursor: pointer; }
  details.pane-wrap > summary::-webkit-details-marker { display: none; }
  .pane-head .bigchev { margin-left: auto; color: var(--gold-soft, #e3cf8f); font-size: .95rem; transition: transform .18s; }
  details.pane-wrap[open] > summary .bigchev { transform: rotate(90deg); }
  .pane-head { display: flex; align-items: baseline; gap: .9rem; flex-wrap: wrap;
    margin: 1.1rem 0 .9rem; padding: .78rem 1.1rem;
    background: var(--sc, var(--gold)); color: #f7f2e7;
    border-radius: 12px; border-bottom: 4px solid var(--gold);
    box-shadow: 0 6px 18px rgba(34,36,58,.14); }
  .pane-head h2 { font-weight: 500; font-size: 1.3rem; display: flex; align-items: center; gap: .55rem; color: #f7f2e7; letter-spacing: .04em; }
  .pane-head h2 .ab-ic, .pane-head h2 .ab-em { color: var(--gold-soft, #e3cf8f); }
  .pane-head .tagline { font-size: .74rem; color: var(--gold-soft, #e3cf8f); font-style: normal; letter-spacing: .22em; text-transform: uppercase; }
  .pane-head .ruleline { display: none; }
  .cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: .7rem; }
  a.pcard { background: var(--surface, #fff); text-decoration: none; color: inherit; border: 1px solid var(--vellum-dim); border-left: 7px solid var(--sc, var(--gold)); border-radius: 11px; padding: .72rem .9rem .66rem; display: flex; flex-direction: column; gap: .16rem; position: relative; }
  html[data-theme="dark"] a.pcard { background: var(--ab-surface); border-color: var(--ab-rule); }
  a.pcard:hover { border-color: var(--sc, var(--gold)); box-shadow: var(--ab-shadow, 0 10px 28px rgba(34,36,58,.12)); }
  .pcard .l1 { display: flex; align-items: baseline; gap: .45rem; padding-right: 3.2rem; }
  .pcard .ab-em { font-size: 1.02rem; } .pcard .ab-ic { width: 1.5em; height: 1.5em; color: var(--sc); }
  .pcard .nm { font-weight: 600; font-size: .94rem; }
  .pcard .arb { font-family: 'Amiri', serif; color: var(--sc, #6b6d85); margin-left: auto; font-size: 1.02rem; }
  .pcard .ds { font-size: .78rem; color: var(--ab-muted2, #6b6d85); line-height: 1.4; }
  html[data-theme="dark"] .pcard .ds { color: var(--ab-muted); }
  .pcard .ab-status { position: absolute; top: .58rem; right: .62rem; }
  .pcard .ab-hovercard { left: .6rem; right: .6rem; top: calc(100% - 6px); }
  .pcard:hover .ab-hovercard, .pcard:focus-visible .ab-hovercard { opacity: 1; visibility: visible; }

  details.pack { border: 1px solid var(--vellum-dim); border-radius: 11px; background: var(--surface, #fff); margin-bottom: .7rem; overflow: visible; }
  html[data-theme="dark"] details.pack { background: var(--ab-surface); border-color: var(--ab-rule); }
  details.pack summary { list-style: none; cursor: pointer; padding: .66rem 1rem; display: flex; align-items: center; gap: .6rem; font-weight: 500; }
  details.pack summary::-webkit-details-marker { display: none; }
  details.pack summary .chev { margin-left: auto; color: var(--gold); transition: transform .18s; }
  details.pack[open] summary .chev { transform: rotate(90deg); }
  details.pack summary .cnt { font-size: .72rem; color: var(--abd-9a9cb3, #9a9cb3); }
  details.pack .packbody { padding: 0 .8rem .8rem; }

  .rail { display: none; position: fixed; left: max(8px, calc(50vw - 510px - 218px)); top: 128px; width: 200px;
    font-size: .8rem; max-height: calc(100vh - 160px); overflow-y: auto;
    background: var(--surface, #fff); border: 1px solid var(--vellum-dim); border-radius: 12px; padding: .5rem .4rem .6rem;
    box-shadow: 0 8px 22px rgba(34,36,58,.08); scrollbar-width: thin; }
  body[data-rail="on"] .rail { display: block; }
  /* desktop: docked left sidebar, content shifts right */
  @media (min-width: 900px) {
    body[data-rail="on"] { padding-left: 236px; }
    body[data-rail="on"] .rail {
      position: fixed; left: 0; top: 0; bottom: 0; width: 236px;
      padding: 1rem .9rem 1.5rem; margin: 0; max-height: none; overflow-y: auto;
      background: var(--surface, #fff); border-right: 1px solid var(--vellum-dim);
      z-index: 85;
    }
    html[data-theme="dark"] body[data-rail="on"] .rail { background: var(--ab-surface); border-color: var(--ab-rule); }
  }
  /* phone: slide-in drawer over the page */
  @media (max-width: 899px) {
    body[data-rail="on"] .rail::before {
      content: '✕ close'; display: block; font-size: .78rem; letter-spacing: .08em;
      color: var(--abd-8a887c, #8a887c); text-align: right; padding-bottom: .4rem;
      border-bottom: 1px solid var(--vellum-dim); margin-bottom: .5rem; cursor: pointer;
    }
    body[data-rail="on"] .rail {
      position: fixed; left: 0; top: 0; bottom: 0; width: min(78vw, 320px);
      padding: 1rem .9rem 2rem; margin: 0; max-height: none; overflow-y: auto;
      background: var(--surface, #fff); box-shadow: 8px 0 28px rgba(34,36,58,.25);
      z-index: 120; animation: ab-drawer .18s ease-out;
    }
    html[data-theme="dark"] body[data-rail="on"] .rail { background: var(--ab-surface); }
    body[data-rail="on"]::after {
      content: ''; position: fixed; inset: 0; background: rgba(23,20,32,.4); z-index: 110;
    }
    @keyframes ab-drawer { from { transform: translateX(-100%); } }
  }
  @media (prefers-reduced-motion: reduce) { body[data-rail="on"] .rail { animation: none !important; } }
  .rail .rsec { margin-bottom: .15rem; }
  .rail .rhead { display: flex; align-items: center; gap: .35rem; padding: .32rem .45rem;
    border-left: 4px solid var(--tabc, var(--gold)); border-radius: 0 7px 7px 0; cursor: pointer; }
  .rail .rhead a { text-decoration: none; color: var(--ink); font-weight: 600; flex: 1; }
  .rail .rhead.on { background: color-mix(in srgb, var(--tabc) 14%, transparent); }
  .rail .rhead .rchev { color: var(--tabc, var(--gold)); font-size: .68rem; transition: transform .15s; }
  .rail .rsec.closed .rchev { transform: rotate(-90deg); }
  .rail .rsec.closed .rbody { display: none; }
  .rail .rgroup { font-size: .62rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ab-muted2, #8a887c); padding: .3rem 0 .1rem 1.15rem; }
  .rail .rpage { display: block; text-decoration: none; color: var(--ab-muted2, #6b6a60);
    padding: .16rem .3rem .16rem 1.7rem; border-radius: 6px; line-height: 1.3; }
  .rail .rpage:hover { color: var(--ink); background: var(--vellum); }
  .rail .rpage .soonmark { color: var(--ab-muted2, #9a9cb3); font-size: .62rem; margin-left: .25rem; }
  body[data-nav="scroll"] details.pane-wrap { display: block !important; }
  body[data-nav="tabs"] details.pane-wrap > summary.pane-head { display: none; }


  /* impact & learning strip */
  .impact { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .6rem; margin-bottom: 1rem; }
  .impact .imp {
    background: var(--surface, #fff); border: 1px solid var(--vellum-dim);
    border-radius: 12px; padding: .65rem .5rem .6rem; text-align: center;
  }
  .impact .imp.placeholder { border-style: dashed; border-color: #cbbf9d; background: transparent; }
  .impact .imp .n { font-size: 1.25rem; font-weight: 600; color: var(--gold); line-height: 1.1; }
  .impact .imp.placeholder .n { color: var(--ab-muted2, #9a9cb3); }
  .impact .imp .l { font-size: .66rem; letter-spacing: .04em; color: var(--ab-muted2, #6b6a60); margin-top: .2rem; line-height: 1.35; }
  .ab-hovercard, .ab-note .ab-bubble { z-index: 999 !important; }
  details.pack .packbody { border-radius: 0 0 11px 11px; }

  .announce-wrap { max-width: 1020px; margin: 0 auto; padding: 0 1rem; }
  @media (prefers-reduced-motion: reduce) { .mtab, details.pack summary .chev { transition: none !important; } }

</style>
</head>

<script>

/* Hijri seasonal banner — reads seasons.json, keyed by islamic-umalqura
   month number. Month-level granularity by design: computed hijri dates
   can differ a day or two from local moonsighting, so we never claim a
   specific day. Override for testing or announced dates: ?hijri=9 */
(async function () {
  let monthNum;
  const forced = new URLSearchParams(location.search).get('hijri');
  if (forced && +forced >= 1 && +forced <= 12) {
    monthNum = +forced;
  } else {
    try {
      monthNum = parseInt(new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',
        { month: 'numeric' }).format(new Date()));
    } catch (e) { return; }   /* very old browser: just skip the banner */
  }
  try {
    const seasons = await (await fetch('seasons.json')).json();
    const m = seasons.months[String(monthNum)];
    if (!m) return;
    document.getElementById('seasonMonth').textContent = 'This month · ' + m.name;
    document.getElementById('seasonTheme').textContent = m.theme;
    document.getElementById('seasonLinks').innerHTML = m.features.map(f =>
      '<a href="' + f.url + '">' + f.label + '</a>').join('');
    document.getElementById('seasonBanner').style.display = '';
    document.getElementById('announceFold').style.display = '';
  } catch (e) { /* seasons.json missing: banner stays hidden */ }
})();

/* ============== Connect panel — icons + links from contact.json ============== */
(async function () {
  /* simple inline brand-style app icons: [bg, glyph path(s) in a 24x24 viewBox] */
  const ICONS = {
    instagram: { bg: 'radial-gradient(circle at 30% 110%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%)',
      svg: '<rect x="3" y="3" width="18" height="18" rx="5.5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="#fff" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.3" fill="#fff"/>' },
    facebook: { bg: '#1877F2',
      svg: '<path fill="#fff" d="M13.5 21v-7h2.4l.4-3h-2.8V9.1c0-.9.3-1.5 1.6-1.5h1.3V4.9c-.3 0-1.1-.1-2-.1-2 0-3.4 1.2-3.4 3.5V11H8.5v3H11v7h2.5z"/>' },
    reddit: { bg: '#FF4500',

    linkedin: { bg: '#0A66C2',

    whatsapp: { bg: '#25D366',

    donate: { bg: '#1b4d38',

    email: { bg: '#c9a13b',
      svg: '<rect x="3" y="5.5" width="18" height="13" rx="2" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M4 7l8 6 8-6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>' }
  };
  try {
    const c = await (await fetch('contact.json')).json();
    const host = document.getElementById('connectInner');
    host.innerHTML = c.groups.map(g => {
      const links = g.links.filter(l => !l.hidden);
      if (!links.length) return '';
      return '<div class="connect-group">' +
        '<div class="cg-title">' + g.title + '</div>' +
        '<div class="connect-icons">' +
          links.map(l => {
            const ic = ICONS[l.id] || { bg: '#6b6a60', svg: '<circle cx="12" cy="12" r="7" fill="#fff"/>' };
            const ext = l.url.startsWith('http');
            return '<span><a class="app-icon" style="background:' + ic.bg + '" href="' + l.url + '"' +
              (ext ? ' target="_blank" rel="noopener"' : '') +
              ' aria-label="' + l.label + '" title="' + l.label + '">' +
              '<svg viewBox="0 0 24 24" aria-hidden="true">' + ic.svg + '</svg></a>' +
              '<span class="app-label">' + l.label + '</span></span>';
          }).join('') +
        '</div></div>';
    }).join('');
    document.getElementById('connect').style.display = '';
  } catch (e) { /* contact.json missing: panel stays hidden */ }
})();

/* ============== Announcements forum — this month's summary sits above it ============== */
(async function () {
  const escA = t => String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  try {
    const a = await (await fetch('announcements.json')).json();
    const posts = (a.posts || []).slice().sort((x, y) =>
      (!!y.pinned - !!x.pinned) || String(y.date).localeCompare(String(x.date)));
    if (!posts.length) return;
    document.getElementById('announcePosts').innerHTML = posts.map(p =>
      '<details class="post static" open>' +
        '<summary>' +
          '<span class="p-title">' + escA(p.title) + '</span>' +
          (p.pinned ? '<span class="p-pin">pinned</span>' : '') +
          '<span class="p-date">' + escA(p.date) + '</span>' +
        '</summary>' +
        '<div class="p-body">' +
          escA(p.body).split(/\n\s*\n/).map(par =>
            '<p>' + par.replace(/\n/g, '<br>') + '</p>').join('') +
          (p.author ? '<div class="p-author">— ' + escA(p.author) + '</div>' : '') +
        '</div>' +
      '</details>').join('');
    document.getElementById('announceFold').style.display = '';
  } catch (e) { /* announcements.json missing: section stays hidden */ }
})();

/* ============== Impact & Learning strip — reads metrics.json ============== */
(async () => {
  try {
    const m = await (await fetch('metrics.json')).json();
    const box = document.getElementById('impact');
    if (!m.impact || !m.impact.length) return;
    box.innerHTML = m.impact.map(x =>
      '<div class="imp' + (x.status === 'placeholder' ? ' placeholder' : '') + '">' +
        '<div class="n">' + (x.icon ? x.icon + ' ' : '') + x.value + '</div>' +
        '<div class="l">' + x.label + '</div>' +
      '</div>').join('');
    box.style.display = '';
    document.getElementById('announceFold').style.display = '';
  } catch (e) { /* metrics.json missing: strip stays hidden */ }
})();



/* ============== Home UI layer — nav.json-driven tabs, cards, settings ============== */
document.addEventListener('DOMContentLoaded', function () {
  var S = AB.settings;
  var COLOR = { gold: 'var(--gold)', general: '#3a3f4d', arabic: '#1b2a5e', quran: '#4d1b30', islamic: '#1b4d38', games: '#14555c', practice: '#a85318', admin: '#4a4466' };
  var state = { tab: new URLSearchParams(location.search).get('tab') || 'general' };

  document.querySelectorAll('.mini img').forEach(function (img) {
    img.onerror = function () { img.replaceWith(AB.fallbackLogo()); };
  });

  AB.navReady.then(function (nav) {
    if (!nav.sections.some(function (s) { return s.id === state.tab; })) state.tab = 'general';

    function card(sec, p) {
      var st = p.status === 'live'
        ? '<span class="ab-status live"><i>●</i>live</span>'
        : '<span class="ab-status soon"><i>◌</i>soon</span>';
      return '<a class="pcard" href="' + p.href + '" style="--sc:' + COLOR[sec.color] + '">' + st +
        '<span class="l1">' + AB.icon(p.icon, p.emoji) + '<span class="nm">' + p.en + '</span>' +
        (p.ar ? '<span class="arb">' + p.ar + '</span>' : '') + '</span>' +
        '<span class="ds">' + p.desc + '</span>' +
        '<span class="ab-hovercard"><b>' + p.en + '</b> — ' + p.desc + '.<br>' +
        (p.status === 'live' ? 'Built and ready.' : 'Page is up; content still being added.') + '</span></a>';
    }

    function paneHTML(sec) {
      var body;
      var gmap = (nav.groups && nav.groups[sec.id]) || null;
      if (gmap) {
        var groups = Object.keys(gmap);
        body = groups.map(function (g, i) {
          var hrefs = gmap[g];
          var items = sec.pages.filter(function (p) { return hrefs.indexOf(p.href) > -1; });
          if (!items.length) return '';
          return '<details class="pack"><summary>' + g +
            ' <span class="cnt">' + items.length + ' page' + (items.length === 1 ? '' : 's') + '</span><span class="chev">▶</span></summary>' +
            '<div class="packbody"><div class="cardgrid">' +
            items.map(function (p) { return card(sec, p); }).join('') + '</div></div></details>';
        }).join('');
        var grouped = [].concat.apply([], groups.map(function (g) { return gmap[g]; }));
        var rest = sec.pages.filter(function (p) { return grouped.indexOf(p.href) < 0; });
        if (rest.length) body += '<div class="cardgrid">' +
          rest.map(function (p) { return card(sec, p); }).join('') + '</div>';
      } else {
        body = '<div class="cardgrid">' + sec.pages.map(function (p) { return card(sec, p); }).join('') + '</div>';
      }
      return '<details class="pane-wrap pane" id="pane-' + sec.id +
        '" style="--sc:' + COLOR[sec.color] + '"' +
        (S.nav === 'scroll' || state.tab === sec.id ? '' : ' hidden') + '>' +
        '<summary class="pane-head"><h2>' + AB.icon(sec.icon, sec.emoji) + sec.title + '</h2>' +
        '<span class="tagline">' + sec.tag + '</span>' +
        '<span class="bigchev" title="Collapse or expand this whole section">▶</span></summary>' +
        '<div class="pane-body">' + body + '</div></details>';
    }

    function render() {
      document.body.dataset.nav = S.nav;
      document.body.dataset.rail = S.rail === 'show' ? 'on' : 'off';
      document.body.classList.toggle('mobile-nav', window.matchMedia('(max-width: 899px)').matches);
      var SECS = (window.AB && AB.visibleSections) ? AB.visibleSections(nav)
        : nav.sections.filter(function (s) { return !s.adminOnly; });
      if (!SECS.some(function (s) { return s.id === state.tab; })) state.tab = 'general';
      document.getElementById('panes').innerHTML = SECS.map(paneHTML).join('');
      if (S.nav === 'tabs') {
        var selPane = document.getElementById('pane-' + state.tab);
        if (selPane) selPane.open = true;
      }
      var tr = document.getElementById('tabsrow');
      tr.innerHTML = SECS.map(function (s) {
        return '<button class="mtab" role="tab" data-t="' + s.id +
          '" aria-selected="' + (state.tab === s.id) + '" style="--tabc:' + COLOR[s.color] + '">' +
          AB.icon(s.icon, s.emoji) + s.title + '</button>';
      }).join('');
      tr.querySelectorAll('.mtab').forEach(function (b) {
        b.onclick = function () {
          state.tab = b.dataset.t;
          history.replaceState(null, '', '?tab=' + state.tab);
          if (S.nav === 'scroll') {
            var tp = document.getElementById('pane-' + state.tab);
            if (tp) { tp.open = true; tp.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
            tr.querySelectorAll('.mtab').forEach(function (x) {
              x.setAttribute('aria-selected', x.dataset.t === state.tab);
            });
            return;
          }
          render();
        };
      });
      document.getElementById('rail').innerHTML = SECS.map(function (s) {
        var gmap = (nav.groups && nav.groups[s.id]) || null;
        var inner = '';
        function pageLink(p) {
          return '<a class="rpage" href="' + p.href + '">' + p.en +
            (p.status === 'soon' ? '<span class="soonmark">◌</span>' : '') + '</a>';
        }
        if (gmap) {
          Object.keys(gmap).forEach(function (g) {
            var items = s.pages.filter(function (p) { return gmap[g].indexOf(p.href) > -1; });
            if (!items.length) return;
            inner += '<div class="rgroup">' + g + '</div>' + items.map(pageLink).join('');
          });
        } else {
          inner = s.pages.map(pageLink).join('');
        }
        return '<div class="rsec" data-rs="' + s.id + '" style="--tabc:' + COLOR[s.color] + '">' +
          '<div class="rhead" data-r="' + s.id + '"><span class="rchev">▼</span>' +
          '<a href="#pane-' + s.id + '">' + AB.icon(s.icon, s.emoji) + ' ' + s.title + '</a></div>' +
          '<div class="rbody">' + inner + '</div></div>';
      }).join('');
      document.querySelectorAll('.rail .rchev').forEach(function (ch) {
        ch.onclick = function (e) { e.preventDefault(); ch.closest('.rsec').classList.toggle('closed'); };
      });
    }
    function announceIcon() {
      var el = document.getElementById('announceIc');
      if (el && window.AB) el.innerHTML = AB.icon('megaphone', '📢');
    }
    try {
      var rawS = JSON.parse(localStorage.getItem('ab-settings') || '{}');
      if (!('rail' in rawS) && window.matchMedia('(max-width: 899px)').matches) S.rail = 'hide';
    } catch (e) {}
    render(); announceIcon();
    document.addEventListener('ab:icons', function () { render(); announceIcon(); });
    document.addEventListener('ab:admin', render);
    document.addEventListener('ab:theme', function () {});

    addEventListener('scroll', function () {
      if (S.nav !== 'scroll') return;
      var cur = null;
      document.querySelectorAll('details.pane-wrap').forEach(function (sec) {
        if (sec.getBoundingClientRect().top < 170) cur = sec.id.replace('pane-', '');
      });
      document.querySelectorAll('.rail .rhead').forEach(function (a) {
        a.classList.toggle('on', a.dataset.r === cur);
      });
    }, { passive: true });

    /* theme button + gear with the two home-only settings */
    var tb = document.getElementById('themeBtn');
    function glyph() { tb.textContent = S.theme === 'auto' ? '◐' : (S.theme === 'dark' ? '☾' : '☀'); }
    glyph();
    tb.onclick = function () {
      S.theme = S.theme === 'auto' ? 'dark' : (S.theme === 'dark' ? 'light' : 'auto');
      AB.save(); AB.applyTheme(); glyph(); syncPop();
    };
    var expBtn = document.getElementById('expBtn');
    function expGlyph() {
      var anyClosed = document.querySelector('details.pane-wrap:not([open]), details.pack:not([open])');
      expBtn.textContent = anyClosed ? '⊞' : '⊟';
    }
    expBtn.onclick = function () {
      var anyClosed = document.querySelector('details.pane-wrap:not([open]), details.pack:not([open])');
      document.querySelectorAll('details.pane-wrap, details.pack, #announceFold').forEach(function (d) {
        d.open = !!anyClosed;
      });
      expGlyph();
    };
    document.addEventListener('click', function (e) {
      if (e.target.closest('summary')) setTimeout(expGlyph, 0);
    });
    expGlyph();
    var railBtn = document.getElementById('railBtn');
    railBtn.onclick = function () {
      S.rail = S.rail === 'show' ? 'hide' : 'show';
      AB.save();
      document.body.dataset.rail = S.rail === 'show' ? 'on' : 'off';
    };
    function closeDrawer() {
      if (!window.matchMedia('(max-width: 899px)').matches) return;
      if (document.body.dataset.rail !== 'on') return;
      S.rail = 'hide'; AB.save();
      document.body.dataset.rail = 'off';
    }
    document.addEventListener('click', function (e) {
      if (document.body.dataset.rail !== 'on') return;
      if (!window.matchMedia('(max-width: 899px)').matches) return;
      var inRail = e.target.closest && (e.target.closest('#rail') || e.target.closest('#railBtn'));
      if (!inRail) closeDrawer();                   /* backdrop / anywhere else */
      else if (e.target.closest('#rail a')) closeDrawer();  /* link chosen */
      else if (e.target.id === 'rail' && e.offsetY < 30) closeDrawer();  /* ✕ strip */
    });
    var pop = AB.buildPopover([
      ['Sections', 'nav', [['tabs', 'One at a time'], ['scroll', 'Scroll all']], render],
      ['Long lists', 'list', [['default', 'Per page'], ['pages', 'Paginate'], ['infinite', 'Infinite']], null]
    ]);
    var gear = document.getElementById('gearBtn');
    pop._btn = gear;
    document.getElementById('gearWrap').appendChild(pop);
    gear.onclick = function (e) { e.stopPropagation(); pop.classList.toggle('open'); };
    function syncPop() {
      var segs = pop.querySelectorAll('.ab-seg');
      if (segs[0]) segs[0].querySelectorAll('button').forEach(function (x) {
        x.classList.toggle('on', x.dataset.v === S.theme);
      });
    }
  }).catch(function (e) {
    document.getElementById('panes').innerHTML =
      '<p style="text-align:center;color:#a33028">Navigation failed to load (assets/nav.json): ' + e + '</p>';
  });
});

</script>
